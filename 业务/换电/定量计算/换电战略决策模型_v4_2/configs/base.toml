# ----------------------车辆数据-----------------------------
# 车辆运营年限：私家车无，网约车8年退役/60万公里报废([网络预约出租汽车经营服务管理暂行办法39条](https://xxgk.mot.gov.cn/2020/jigou/fgs/202212/t20221205_3719525.html?utm_source=chatgpt.com))，出租车8年、货车15年([机动车强制报废标准规定第5条](https://www.mee.gov.cn/gkml/hbb/gwy/201301/t20130115_245171.htm))
# 老质保法规：乘用车8年/12万公里、商用车5年/20万公里（[关于2016—2020年新能源汽车推广应用财政支持政策的通知 二（三）](https://www.miit.gov.cn/jgsj/zbys/wjfb/art/2020/art_0c6ec8f41f614a3086c62f3851a9591d.html?utm_source=chatgpt.com)）
# 电池寿命：没有强制退役规定，国标SOH=80%([GB/T 31484-2015 电动汽车用动力蓄电池循环寿命要求及试验方法 第5.2条](https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=44ECF0443BD82A81A512FB05092677EE&utm_source=chatgpt.com))

[vehicles.heavy]
label = "重卡"
station_group = "heavy"
battery_kwh = 500.0              # 增量单车带电量 kWh：JPM英中对照（长续航趋势），存量口径420kWh（GGII）
stock_wan = 900.0               # 2030重卡保有 万辆：行业重卡电动化基准
replacement_cycle_years = 9.0    # 重卡更新周期 年
# 2025新能源重卡销量 233,206辆（同比+181.91%，交强险实销不含军车出口），LNG/柴油重卡不属于NEV；
# 其中纯电224,759辆占96.38%、燃料电池7,282(3.12%)、插混1,165(0.50%)；
# 纯电：充电157,137(67.38%)、换电67,622(29.00%)。
# 信源：[新浪/看点资讯引第一商用车网](https://cj.sina.com.cn/articles/view/7829375716/1d2aacae400101sfj8)
# NEV渗透率斜率（先快后慢S型）：2025全年28%（12月破半但全年综合不足30%）→
# 2026上半年综合33%、6月峰值44%、下半年再上→2026全年35%（较2025多7个点）→其后四年摊15点
# 信源：[第一商用车网月度渗透](https://www.cvworld.cn/news/Onedata/250628/230405.html)
nev_rates = [0.35, 0.43, 0.46, 0.48, 0.50]
pure_electric_share = 1.0        # 重卡换电均发生在纯电车型（纯电含换电占NEV 96.38%，近似取1）
no_swap_catl_share = 0.35        # 无换电情景下CATL在重卡动力电池市占率
# 2025年已经进入CATL换电体系的重卡存量，v3.2约0.7万辆；并入2026批次参与累计车辆、装机与CAPEX。
# 来源：[盐田港案例](https://www.yict.com.cn/article/detail/12754.html)
existing_catl_swap_stock_wan = 0.7

[[vehicles.heavy.scenes]]
name = "短途"
weight = 0.38                    # 短途销量占比（JPM续航表）
# 换电渗透率30% = 2025实测自然选择基线（钢厂/港口/矿山场景）：[百度号成本革命2026-8](https://baijiahao.baidu.com/s?id=1872927453560932324)（已确认基线）
# 政策刺激峰值曾达50%+（2021-2022唐山/包头试点）：[电动重卡狂飙2026-6](https://baijiahao.baidu.com/s?id=1868770572631070105)（已确认历史峰）
# 短途换电:充电自然比约30:70（充电桩集中配套，2025-10充电占纯电70%），非5:5
# （5:5为政策刺激瞬时峰值）：[交强险2025-10月度数据](https://baijiahao.baidu.com/s?id=1849988492870258539)
swap_penetration = 0.30
# 宁德市占30%/启源70%（三七开）：短途属启源传统优势（建站市占71%、交付55%），宁德为小头，[启源方案](https://chejiahao.autohome.com.cn/info/25447198)
catl_swap_share = 0.30
daily_km = 130.0
onboard_battery_kwh = 342.0
energy_consumption_kwh_km = 1.50

[[vehicles.heavy.scenes]]
name = "中途"
weight = 0.50                    # 中途销量占比 50%（JPM续航表 表13）
# 换电渗透率50%：介于短途30%/长途70%之间，符合效率敏感梯度；快递调拨+钢厂/煤炭固定线路
# 天然偏好换电，2022年换电曾占55:45：[汽车之家2026-7奥动原话](https://chejiahao.autohome.com.cn/info/25909400)（已确认取50%）
swap_penetration = 0.50
catl_swap_share = 0.30           # 宁德30%/启源70%（三七开，用户拍板）：中途属启源传统优势
daily_km = 400.0
onboard_battery_kwh = 513.0
energy_consumption_kwh_km = 1.70

[[vehicles.heavy.scenes]]
name = "长途"
weight = 0.12                    # 长途销量占比 12%（4M26，FY25为6%）（JPM续航表 表13）
# 换电渗透率70%（取60-80%中位，刚性但分母小）：干线渗透<1% 但换电为王
# [汽车之家](https://chejiahao.autohome.com.cn/info/25909400)（已确认取70%）
swap_penetration = 0.70
# 宁德70%/启源30%：长途属宁德底盘式主阵地（极兔5000台验证），启源背包式亏吨不适干线靠存量外溢
#：[同花顺极兔订单](https://m.10jqka.com.cn/20260702/c677904714.shtml)（已确认长途宁德7成）
catl_swap_share = 0.70
daily_km = 650.0
onboard_battery_kwh = 513.0      # 长途背电 kWh：3块叠至513kWh
energy_consumption_kwh_km = 1.70 # 长途电耗 kWh/km：山区上探2.0+

[vehicles.city]
label = "城配物流"
station_group = "choco"
battery_kwh = 80.0               # 城配换电包 80kWh：主流轻卡80kWh [太平洋汽车](https://www.pcauto.com.cn/ask/3397635.html) 实际运营续航~250km
stock_wan = 1500.0              # 城配场景车保有量 万辆（运联研究院[中国城配行业发展报告](https://news.qq.com/rain/a/20240122A031JG00)，保有量恒定不增长）
# 商用车总保有（2023基准[能链研究院/界面新闻2023-3](https://www.jiemian.com/article/9115697.html)）：约4000万
# 轻商车：约3000万 = 商用车4000−重卡900−公交大客100
# 轻商分类：轻卡占57%≈2280万、轻客>300万、微卡/皮卡各<100万）
# 城配2022为1459万（[前瞻产业研究院2023分车型](https://x.qianzhan.com/xcharts/detail/d52164dd330ce52d.html)）
# 城配1500万车型构成：城配轻卡784万(54%) + 交叉型商乘两用车/面包车/VAN 454万(31%) + 微卡/依维柯(轻客)约262万(15%)。
# **口径陷阱（必须澄清）**：[中物联《2026中国公路运力发展报告》](http://new.chinawuliu.com.cn/lhhzq/202607/12/667535.shtml)
# 称2025年底"营运载货汽车"1168.9万辆（同比+1.1%），该口径只统计行驶证标注"营运"、以盈利为目的的货车，
# 剔除了大量非营运蓝牌轻卡（个体户拉自家货/单位自用车/"私家车化"轻卡），与4000万/3000万全保有量差一个量级。
# 总量趋势：城配属营运生产资料，靠老车更新维持、总量不增长（营运载货汽车同比仅+1.1%；城配2022→2023仅+3%），
# 与网约车/出租车演化一致 → 保有量恒定，年销量=年更新量，无净增。
replacement_cycle_years = 8.0    # 更新周期 年：1500/8≈187.5→取整190万/年=电车资源实测193.7万/年(十万级)
# NEV渗透率S曲线(2026→2030)：基准2025物流车整体32.4%（全量193.7万/NEV 62.8万，电车资源保险上险口径）；
# 其后类比出租车/网约车S曲线(2018:33%→2023:87%→2025:≈100%)外推至2030≈95%，留5%给极寒/重载边缘场景。
# 基准年分车型渗透率（电车资源2025）：中面96.6%/大面59.4%/轻卡31.3%/小卡23.9%/微面22.3%/微卡9.0%/中卡6.4%
# （面系VAN已近饱和，卡系里轻卡>小卡>微卡>中卡）；不可按分车型求和替代整体口径。
# 信源：[电车资源《31省市渗透率》](https://www.evpartner.com/news/262/detail-82448.html)；
#      [电车资源行业研究院季度报](http://newcarschannel.cn/life/202606231524292429.html)（2026Q1渗透率30%、同比+7pct）
# 交叉校验（不采用，仅口径参照）：第一商用车网轻卡(GVW 3.5-6T交强险)2025渗透25.97%
#      [2025轻卡年终盘点](https://m.cvworld.cn/news.aspx?newsid=236056)、2026-05达33.51%
#      [2026前5月轻卡](https://truck.cvworld.cn/news/Onedata/260614/238847.html)；
#      方得网(轻卡GVW 1.8-6T)2025全年22.3% [方得网](https://www.163.com/dy/article/KN41S45N0527RT9S.html)。
#      → 三家因GVW边界与"总量"定义不同而异；为保证与本文Part3内部自洽，本模型统一采用**电车资源**口径。
nev_rates = [0.50, 0.65, 0.80, 0.90, 0.95]
pure_electric_share = 1.0
daily_km = 300.0                # 城配高频子集日均里程 km：程序定义高频>250km，取300 [卡车之家城配运营](http://www.360che.com/news/250109/194497.html)
energy_consumption_kwh_km = 0.27 # 城配电耗 kWh/km：电动轻卡百公里25-40kWh，取0.27 [汽车之家2026-06](https://chejiahao.autohome.com.cn/info/25837705)
no_swap_catl_share = 0.35        # 无换电情景下CATL在城配动力电池市占率

# —— 城配「存量单列不并入」结构（补回自 _archive/重卡与城配物流换电规模测算_合并对比.py v2）——
# 城配换电2025才起步，存量层基数用 2025 单年 NEV销量(62.8万) 即可，但换电渗透率极低(2%)；
# 此前8%/累计180万口径偏乐观。该存量层高不确定性，单列输出、不并入 headline 增量。
city_existing_nev_stock_wan = 62.8   # 2025单年城配NEV销量 万辆（存量层基准）：[城配NEV销量统计](https://www.qijiswap.com/)
city_stock_swap_penetration = 0.02
city_stock_catl_share = 0.80

