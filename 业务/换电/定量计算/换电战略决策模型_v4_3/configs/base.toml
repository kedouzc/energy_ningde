# ----------------------并购情景（MANIFEST §7）-----------------------------
#
# 【2026-09-15 重排】情景按**复用程度**分档，不按"买了什么"分档。
# 原因：联网查证后，决定这笔钱值多少的不是"买到几座站"，是"买到的站能用到什么程度"。
#   · 李斌 2025-11 明确表示萤火虫不会接入巧克力换电，**理由是液冷 vs 风冷**——
#     站体物理不兼容是**一手表态**，不是推测。两边官方口径始终是"双网并行"，不是合并。
#   · 重卡侧同理：启源是顶吊/后背式（电池在驾驶室后方），骐骥是底盘式（电池在车架下），
#     电池位置、换电机构、包规格三者全不同。后配式互换国标 2023 年已发布，
#     **底盘式互换标准 2026 年底才计划完成**（深圳先行标准）。
#   · 穷尽检索，**没有任何一座换电站跨标准改造的公开案例、方案或成本数据**。
# 所以基准档是「站址与电网接入可复用、站体需重建」，不是整站复用——
# 整站复用那一档保留为乐观档，但它**没有任何证据支撑**，卡面必须写明。
#
# 已删除两档（2026-09-15）：「纯自建_无并购参考」与「启源入股_不收蔚来」的"不收蔚来"定语——
# 启源入股已于 2026-08 完成，"没有并购"这个对照面已不存在。

[mna]
