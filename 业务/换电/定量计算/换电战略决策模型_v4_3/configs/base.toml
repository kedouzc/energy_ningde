# 【蔚来这笔交易分三块，而三块的命运在不同结构下是相反的 —— 情景因此按结构分档】
#   A 站址资源（4,006 座站的地与电力接入）  · 已建模（站址复用那一档）
#   B 存量电池银行（42GWh、55 万用户的 BaaS 租金流） · **尚未建模**，见 4.5 敞开项
#   C 增量车型适配（萤火虫等新车用不用 CATL 标准） · 决定 A 与 B 谁值钱
#
# **关键结构判断**：卖方的存量电池全部由 CATL 供应，所以即便电池到寿，
# 只要车主续约，仍会切回 CATL 供应链——**买电池银行买的是"用户不流失的可持续规模"**，
# 而不是买回自己的电池。CATL 的角色从"卖一次电池赚制造毛利"变成
# "持续收租 ＋ 每轮更新再卖一次"，是纵向一体化。
#
# **而 A 与 B 互斥**：站址越值钱，说明改造越彻底、存量用户流失越多；
# 存量越值钱，说明站网照旧跑卖方的车、站址就不需要复用。**两块不能相加。**
#
# **C3（把站改造成 CATL 标准）在谈判上几乎不可能**：卖方一直押注换电路线，
# 若卖掉换电业务后自家新车型反而用不了换电，等于断了自己一条生路。
# 卖方肯卖的前提一定是"我的车还能换电"。**保留 C3 只作对照，不作基准。**

