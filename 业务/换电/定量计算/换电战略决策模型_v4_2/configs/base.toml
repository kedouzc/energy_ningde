# ============================================================
# 换电块寿命推算模型（替代各车型硬编码 battery_life_years）
# ============================================================
# 依据《超换一体.md》§2.1「为什么是8年？——基于2000次循环临界点的科学推演」：
# 不以固定年份为切换点，而以 SOH 衰减的**物理临界点**为触发条件，再按各车型实际循环强度反推年限：
#     life_years = min( critical_cycles ÷ (swap_frequency_per_day × operating_days), calendar_cap_years )
# 之所以需要双轨（循环寿命 vs 日历封顶）：
#   · 营运车辆（出租/网约/物流）日均换电1.5-2次 → 年循环548-730次 → **2.7-3.6年**即达2000次临界点
#     → 由循环寿命主导（这解释了蔚来对营运车提供8年/80万公里质保的背面：营运电池仅约3年就需退出换电网络）
#   · 家用车日均换电0.3-0.5次 → 年循环110-183次 → 理论需 10.9-18.2 年
#     → 纯按循环推得过长，须叠加**日历寿命封顶**（LFP约8-10年，即便循环未到也因静置衰减/技术迭代退役）
#     → 取 min(循环推算, 10) = 10 年，与超换一体「家用8-10年」结论一致
# 信源：[超换一体.md §2.1](d:/AI/证券投资/投研/能源/宁德时代/业务/换电/定性分析/超换一体.md)
#       （2000次循环≈82-85% SOH为用户体感临界点；营运2.7-3.6年 / 家用10.9-18.2年；
#         最终基准8年=两种车型折中，但触发条件是循环次数而非固定年份）
#       [2025换电站年终服务量报告](https://m.book118.com/html/2025/1218/6035215201012031.shtm)
#       （出租/网约约占68%、日均换电1.5-2次；私家车占25%、日均约0.5次；物流车等占7%）
# 国标锚点：[GB/T 31484-2015 电动汽车用动力蓄电池循环寿命要求及试验方法](https://openstd.samr.gov.cn/bzgk/std/showGb?type=online&hcno=44ECF0443BD82A81A512FB05092677EE&request_locale=zh)
#       （循环1000次时容量不应低于80%，与2000次临界点同属SOH衰减口径）
#       [GB/T 46991.1-2025 动力电池耐久性要求及试验方法](https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=D0A1838047E3F5227AC4F7B5721B24FC)
[battery_life_model]
critical_cycles = 2000.0   # 退出换电网络的循环临界点（SOH≈82-85%，用户体感临界点）
calendar_cap_years = 10.0  # 日历寿命封顶（低频私家车取 min 后=10年；营运车由循环主导不受此限）
# v3.2遗留硬编码寿命：不参与基准测算，仅供附录「新旧寿命口径对比」程序化重跑对照。
# 它与模型自身频次参数并不自洽——重卡5.7年隐含日均换电1.00次而模型实算1.83次；
# 巧克力站3.8年隐含1.50次而使用量加权实算0.87次。保留在此以便量化该口径差异的影响。
legacy_v32_vehicle_life_years = { heavy = 5.7, city = 3.8, taxi = 3.8, ridehail = 3.8, robotaxi = 3.8, private = 10.0 }
legacy_v32_station_life_years = { heavy = 5.7, choco = 3.8 }

# ============================================================
# 充电段CATL市占率（v4.2.2 重构：取消"份额提升实现率"，改为三档直接给份额）
# ============================================================
# 原设计缺陷：先设"目标提升幅度"再用"实现率"打折，绕了一道；且实现率=1.0等于
# 把最乐观情形当基准，与全报告其它部分取中枢/保守的审慎原则不一致。现改为直接
# 给出两档份额，中性档由程序取均值派生（不再手工拍值）：
#     悲观 = 无换电保护、充分竞争下充电段跌到的份额
#     乐观 = 换电标准锁定后充电段能保持的份额
#     中性 = (悲观 + 乐观) ÷ 2
#
# 【悲观档为什么取 0.35 / 0.33】——宁德时代国内动力电池份额持续下滑：
#   2021 年 52.1% → 2022 年 48.2% → 2024 年 45.08% → 2025 年 1-4 月 42.9%（同比 −4.77%）
#   → 2025 年 4 月单月 39.44%（时隔 18 个月首次跌破 40%）→ 2025 年 1-8 月 37.1%。
#   二线厂商（国轩高科、中创新航、亿纬锂能）持续分食，2026 年已分走约 36% 市场空间。
#   故 0.35 是"竞争充分展开、换电未能提供保护"的合理下限；私家车取 0.33 更低，
#   因特斯拉/比亚迪/华为不接入第三方体系、且比亚迪自供电池。
#   信源：
#     [上市以来营收首降（2025-03）2021/2022/2024份额](https://baijiahao.baidu.com/s?id=1826900714674000597)
#     [铁王座不稳（2026-01）2025年1-4月42.9%、4月单月39.44%](https://baijiahao.baidu.com/s?id=1855101905343795125)
#     [最新动力电池排行：跌破40%](https://www.toutiao.com/article/7504916999647085093/)
#     [2025年1-8月37.1%](https://zhidao.baidu.com/question/503003842838987252.html)
#     [二线厂商分食约36%（2026-08）](https://www.d1ev.com/newsflash/311723)
#
# 【乐观档的依据】——换电对充电段的保护分两层，只有第一层成立：
#   ① 标准锁定（成立）：换电车辆适配CATL巧克力标准块的尺寸/接口/BMS协议，
#      即便偶尔充电也装不了第三方标准块，故换电车辆自身被锁定在CATL。
#   ② 数据反哺（不成立/无证据）：换电运营数据提升CATL整体产品力→抬高全市场充电份额。
#      该链条最长、证据最弱，v4.2 已将其排除在可归因价值之外。
#   因此乐观档只能反映①，不能外推到非换电车辆。
#   · 重卡取 0.55（自原 0.70 下调）：宁德在重卡换电段市占率最高也只有 0.70（长途场景），
#     充电段不应高于换电段；且重卡"一家独大格局松动"，亿纬锂能 2030 年在重卡锂电目标 20%。
#     信源：[政策驱动重卡电动化加速，宁德份额趋松](https://xueqiu.com/7143384614/394666448)
#   · 城配/出租/网约取 0.45（沿用原值）
#   · 私家车取 0.40（沿用原值；换电保护弱，因私家车主要换电、充电场景少）
#   · Robotaxi 取 0.00（全量换电，本无充电段）
#
# 【预测分歧提示】高盛 2026-07 大幅看多（国内 2025 年 46% → 2030 年 50%），
# 与固态电池产业链预测的 2030 年 35%~40% 差异极大。本模型不采用任一端点，
# 而以悲观/中性/乐观三档并列，由敏感性检验结论对该参数的依赖程度。
#   信源：[高盛预测2030年市占率达五成](https://baijiahao.baidu.com/s?id=1870329164272602666)
#         [固态电池产业链预测2030年35%-40%](https://baijiahao.baidu.com/s?id=1831624566960109673)
# ============================================================
[charge_share]
scenario = "中性"   # 基准情景：悲观 / 中性 / 乐观（中性由程序取两档均值派生）

[charge_share.heavy]
pessimistic = 0.35   # 充分竞争、换电未提供保护
optimistic = 0.55    # 换电标准锁定后能保持（自原0.70下调）

