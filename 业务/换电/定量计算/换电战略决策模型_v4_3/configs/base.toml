# ═══════════════════════════════════════════════════════════════════════
# 事件表（2026-09-13h 新增）
# ───────────────────────────────────────────────────────────────────────
# **参数是怎么变成现在这样的，以及每一次变动值多少钱。**
#
# 为什么要它：并购启源之后 catl_swap_share 从 0.30 改到 0.80，一个参数让增量价值
# 几乎翻倍——而这次改动在仓库里只留下一行行尾注释。**"看到并购 → 直接改参数"
# 是把结论写进输入**；正确的形态是「事件扰动参数、扰动产生价值差分」，三者分开。
#
# kind 三类：
#   已发生 → 参数当前值已含它。程序断言 `to == 当前值`，对不上即中断。
#            差分＝把参数退回 `from` 重跑一次，差额就是这个事件带来的价值。
#   预期／中检点 → **不改当前值**。差分＝推进到 `to` 重跑，差额＝"若兑现值多少"。
#            **中检点因此从一张定性清单变成「参数扰动 ＋ 价值差分」。**
#
# 纪律：**参数的当前值仍然只有一个家**（各功能段的 `.v` / 裸值）。
# 事件表是账本不是第二个家——它只登记 from/to，由断言把两边钉在一起。
# 计算与打印住 src/events.py；查看：python src/run.py（末尾一节）。
# ═══════════════════════════════════════════════════════════════════════

[[event]]
id    = "qiyuan_acquisition"
date  = "2026-08"
kind  = "已发生"
title = "收购启源芯动力"
src   = "src.qiyuan_appraisal"
why   = "赛道内唯一够格的独立对手被并入体系，重卡换电的竞争假设从「与启源持续分食」变为「份额整合」。买什么说明缺什么：买的是站网与场景卡位，说明缺的是时间不是技术。 **重卡这一笔买的是时间**：干线网络的站址与卡位是排他的，自己重铺要很多年。注意两家的技术路线不通用（启源顶吊/后背式、骐骥底盘式，电池位置与换电机构全不同），所以买到的站**不能直接跑骐骥的车**，能复用的是站址与电力接入"
changes = [
  { param = "vehicles.heavy.scenes.0.catl_swap_share", from = 0.30, to = 0.80 },
  { param = "vehicles.heavy.scenes.1.catl_swap_share", from = 0.30, to = 0.80 },
  { param = "vehicles.heavy.scenes.2.catl_swap_share", from = 0.70, to = 0.80 },
]

[[event]]
id      = "weilai_battery_bank"
date    = "待观察"
kind    = "预期"
title   = "收购蔚来电池银行与换电网络"
src     = "src.qiyuan_appraisal"
trigger = "**看交易公告，不看传闻**：蔚来能源（蔚能）控制权或其电池资产包发生转让，且受让方为 CATL 或其关联方。次级信号（不足以判定兑现、但会改变概率）：蔚能新一轮融资由 CATL 领投、或双方公告换电标准并网"
why     = "**与收购启源同构：收编赛道内最强且存量规模最大的对手**，份额因此取同一档 0.80——不取 1.0 是因为其他对手竞争力虽弱但仍留一定空间，算保守估计。 **口径要说准：这里拿到的不是「标准独占」，是「两套标准都归我」。**卖方肯卖的前提是自家车还能换电，所以最可能的结构是它的标准继续存在、只是换了老板；按 `catl_swap_share` 的定义（换电车辆里有多少用 CATL 的），那仍然算 CATL，所以 0.80 站得住——**但它对站址复用的含义正好相反**：不改造，就省不出造价。 **只动乘用车（出租/网约/私家车），不动重卡与城配**：卖方是卖高端私家车起家的，营运场景的专属方案公司自述 2027 年才推出，它的用户与电池资产落不到重卡、城配池子里。 **站体物理不兼容有一手表态**（对方创始人明说自家小车不会接入巧克力换电，理由是液冷 vs 风冷），所以资本侧对应 C1 档而不是改造档。 **为什么这件事可能不发生**：卖方一直押注换电路线，把换电业务整体出让等于交出战略主动权，交易难度不小——这降低的是这张卡的**分量**，不是它的**金额**。 本卡只登记**份额层**；资本侧归 `[[mna.scenarios]]` 一家，两边不重复计价"
changes = [
  { param = "vehicles.taxi.scenes.0.catl_swap_share", from = 0.50, to = 0.80 },
  { param = "vehicles.ridehail.scenes.0.catl_swap_share", from = 0.50, to = 0.80 },
  { param = "vehicles.private.scenes.0.catl_swap_share", from = 0.50, to = 0.80 },
  { param = "vehicles.private.scenes.1.catl_swap_share", from = 0.50, to = 0.80 },
  { param = "vehicles.private.scenes.2.catl_swap_share", from = 0.50, to = 0.80 },
]

[[event]]
id    = "methanol_price_converge"
date  = "待观察"
kind  = "中检点"
title = "绿色甲醇价格向灰醇收敛（下行）"
trigger = "绿色甲醇到岸价 ÷ 灰甲醇价 ≤ 1.3（2026-09 实测约 3.0 倍）。**看价格不看渗透率**：价格是因、渗透率是果，且价格月度可查、渗透率要等年报口径。机器判定见 track（audit/tracking_methanol.json 由 agent 月更，首个达标月自动生效，不预设年份、不手改参数）"
track = { source = "methanol", field = "ratio", op = "<=", value = 1.3 }
src   = "src.methanol_tco_2026"
why   = "甲醇与电动之争是**动力源之争**，不是补能方式之争——一辆车要么烧甲醇要么用电。所以它压的是**纯电渗透率**这一层，压不到「已经是纯电的车里有多少用换电」那一层。 **生效节奏（数据驱动）**：月度比价由 agent 逐月录入 tracking_methanol.json，程序扫序列取**首个达标月**＝生效月；达标当月才观察到价格、车队采购从次月起转向，故**达标当年只压剩余月份**（如兑现年年中达标→当年权重 6/12，只影响下半年），次年起全效，事件不追溯。**兑现年年底前未达标＝窗口内零影响；兑现年之后才达标＝只影响兑现年后的延长段，当前不计价、仅用于解释估值倍数**（当前尚在窗口内，延长段效应不入账；见 events.py 延长段分支）。不设交付滞后期——比价持续在跟踪，达标即按当月起算，滞后只会重复计价。 **幅度**：甲醇拿走的是干线——重卡三场景里中途 0.50 ＋ 长途 0.12 ＝ 权重 0.62，假设其中约四分之一永久归甲醇 → 0.62×0.25 ≈ 0.155，取完整效应 **nev_rates 全效绝对下调 0.15/年**（按上面的年内权重分摊）。天花板 0.80 → 0.65：干线那块退出电动化，上限不该还停在原处（ceiling 只作用于兑现年后延长段，窗口内达标则整体切换）。 **这个四分之一是声明不是测算**，什么会让我改它：出现干线甲醇重卡的实际保有量数据。 **承重方**：甲醇电动整车购置成本低于纯电，且吉利远程「远醇」已建 1000+ 座加注站、规划 2027 年底 4000 座——它是一个正在出现的承重方，但它扛的是**加注网络**而非燃料成本曲线。 **推/拉判据**：CATL 自己说甲醇不行＝推；燃料生产商（非整车厂）自建加注网络＝拉"
timed_changes = [
  { param = "vehicles.heavy.nev_rates", type = "delta", full_delta = -0.15 },
  { param = "vehicles.heavy.nev_ceiling", type = "set", from = 0.80, to = 0.65 },
]

