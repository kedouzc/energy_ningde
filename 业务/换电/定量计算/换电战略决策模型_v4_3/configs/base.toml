# ----------------------财务数据（MANIFEST §6）-----------------------------

[finance]
# WACC 7.5%：能源基建行业收益率 6–8% 的中性中枢（显式假设）。参照谱系：
# 蔚能 REITs 4.68%（资产端下限）→ 协鑫能科 8.5–9.1% → 启源股权评估 10.34%（股权端上限）。
wacc = 0.075
# CRF 0.15 ← v3.2 §1.2.2「从全生命 CAPEX 到年 FCFF：期望收益率，非成本线」。
# 关键区分：WACC 7.5% 只是"必须收回成本的下限"，估值要看期望收益率，必然高于成本线。
# CRF(i,15年) = i ÷ (1−(1+i)^−15)：10%下沿→0.131，15%上沿→0.171，取中值 0.150（隐含要求回报≈12.4%）。
# 注意：不要用 WACC 7.5% 反推的 0.1133 来质疑本值——那是成本线口径，不是本参数的口径。
capital_recovery_factor = 0.15
required_return_range = [0.10, 0.15]
tax_rate = 0.25
# 债务比例 60%：经验假设（类固收项目可做到 1:1.5 杠杆）
debt_ratio = 0.60
# 项目公司级融资利率 2.5%（非集团绿债 1.48–1.70%）：谱系=宁德 AAA 1.5–1.7% 下限、
# 启源实际 3.02% 上限，2.5% 取 AA+ 绿债上沿。锚：启源并购评估基础数据 §七
debt_interest_rate = 0.025
# 建站持股比例 40%：假设值（保守档）。锚=蔚能案例：蔚来经天地资本增资后 27.8% 实控。
# 敏感性：0.278（蔚能锚）/ 0.30 / 0.40（保守）。v4.3 单一真相源——外部销售口径在代码中以 1-0.40 派生（原 external_sales_share 已删除）
construction_ownership = 0.40
# 制造 PE 20× ← v3.2 §6.6：延续当前估值水平，不做扩张假设。
# 校核：2026 动力净利拍 600 亿 × 20 = 12,000 亿；对照集团市值 18,250 亿、
# 2026E 净利一致预期约 950 亿 → 集团隐含 PE ≈ 19×，故 20× 与市场当前给价同档。
# 敏感性 15/20/25 → 动力线价值 13,574 / 16,608 / 19,460 亿（±2,943 亿），是全模型最大单一杠杆。
manufacturing_pe = 20.0
# 运营 EV/EBITDA 18× ← v3.2 §4.1「18× 是含战略溢价的基建运营倍数，不是 GP/科技资管倍数」。
# 三族对照（判断倍数看"谁扛资产、谁赚什么钱"，不能只看资产轻重）：
#   ① 资管/科技平台型 18–22×（Blackstone 21.8×）——宁德**不属此族**：BX 出资约 1%、
#      靠管理费+carry；宁德综合自有出资约 16%（债 60%／权益 40%，权益内再占 40%），
#      是带电池供应的战略 co-investor，钱主要来自电池销售与标准锁定，结构不同构；
#   ② 重资产基建运营型 6.7–14×（Brookfield 6.7×、公用事业 8–14×、储能平台 10–14×）——本锚所在族；
#   ③ 车+能源网络复合族（特斯拉 89.7× LTM）——只作叙事参照，不作倍数锚。
# 结论：锚 ② 的 6.7–14× ＋ 宁德"电池供应＋标准卡位"的温和战略溢价 → 18× 取上限附近的中枢，
# **已含溢价，不应再叠加**。宁德自身 LTM 仅 13.0×（比亚迪 6.5×）可作下限参照。
# 敏感性 18×→25×（+39%）只把宁德贡献从 3,234 抬到 4,866 亿，不改变"占比有限、属卡位而非规模驱动"的主结论。
swap_ev_ebitda = 18.0
manager_fee_rate = 0.010
manager_net_margin = 0.40
manager_pe = 25.0
transaction_cost_rate = 0.020
# 分析期 15 年（2026–2040）：与世联评估预测收益期 2025.12–2040.12 对齐（非 REITs 12 年存续期）
model_horizon_years = 15

