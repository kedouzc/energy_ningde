}

    --line: #2C3843; --accent: #86BDD1; --t0: #E4917A; --t1: #AFC2D1; --t2: #80C99D;

.tiers button[data-idx="2"] { --tier-c: var(--t2); }

}

  "结论": "\u003cp\u003e本页回答：宁德时代做重卡换电，到 2030 年能做多大、值多少钱、对宁德意味着什么。顶部三档是\u003cstrong\u003e换电电池一生比对手多交付的电：0%／20%／50%\u003c/strong\u003e（压力测试，只这一样分档；设备、投资、购置税取中性）。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e一句话\u003c/strong\u003e：换电在跑得狠的重卡上确实更便宜，2030 年能做成约 2,053 亿度电、近两万座站的生意；但按\"对手不赚钱也要做\"的限价，每度只赚几分钱，税前回报 1%–2%，本身撑不起\"几倍\"。值不值得押，看三件事：价格规则、谁的钱最便宜来持有电池、护城河。当前：观察仓。\u003c/p\u003e\u003cp\u003e数字全部出自 \u003ccode\u003e主线/换电计算书.md\u003c/code\u003e（毛估版，待研究者审），卡片下的小字是出处。\u003c/p\u003e",
  "什么会推翻": "\u003cp\u003e下面每一行是一个能翻结论的数：现在取多少、动到多少结论就变、会不会真发生、从哪能持续跟踪。按对中性结论的影响从大到小排。\u003cstrong\u003e只有电池寿命差是技术问题，其余都是价格、资金和判断。\u003c/strong\u003e\u003c/p\u003e",
  "为什么这么想": "\u003cp\u003e结论靠一条六环的论证链撑着：商业模式在变 → 需求是真的 → 站要跟着需求建 → 但钱很薄 → 所以价值在护城河、便宜资金和价格规则 → 历史先例怎么说。任何一环断了，后面的环要重新看。\u003c/p\u003e",
  "怎么算出来的": "\u003cp\u003e每章一张表，按\u003cstrong\u003e总分\u003c/strong\u003e排列：最上面一行是这一章要的结果，往下缩进的是组成项和输入；\"公式\"一列写明怎么算、代入了哪些数。三档只改每度利润与回报，卖量、站数、投入三档相同。算式在 \u003ccode\u003e主线/毛估链.py\u003c/code\u003e，每个式子对应计算书的一张表。\u003c/p\u003e",
  "跟踪": "\u003cp\u003e每一条写明从哪个信源能查到、出现什么情况说明结论错了。只算客户主动的\"拉动型\"信号——宁德自己签的单和规划只算意图。标有\"见月度仪表盘\"的条目，在同目录的月度跟踪仪表盘里有逐月数据（第一商用车网，经电车人整理）。\u003c/p\u003e"
 },
 "来源": {
  "数据": "主线/结论数.json",
  "文字": "主线/沙盘文字.md"
 }
};

(function () {
  'use strict';

  var MINUS = '−';
  var DASHBOARD = '月度跟踪仪表盘.html';

  function el(tag, attrs) {
    var n = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') n.className = v;
        else if (k === 'html') n.innerHTML = v;
        else n.setAttribute(k, v === true ? '' : v);
      }
    }
    for (var i = 2; i < arguments.length; i++) append(n, arguments[i]);
    return n;
  }
  function append(n, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { append(n, x); }); return; }
    n.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  }

  // 数字显示：整数加千分位；小于 1 的小数原样；负号用 U+2212；字符串原样。
  function groupInt(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function fmt(v) {
    if (v === null || v === undefined || v === '') return '—';
    if (typeof v === 'number') {
      if (!isFinite(v)) return String(v);
      var neg = v < 0, a = Math.abs(v), s;
      if (Number.isInteger(a)) s = groupInt(String(a));
      else if (a < 1) s = String(a);
      else { var p = String(a).split('.'); s = groupInt(p[0]) + (p.length > 1 ? '.' + p[1] : ''); }
      return (neg ? MINUS : '') + s;
    }
    if (typeof v === 'boolean') return v ? '是' : '否';
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  }
  function looksNumeric(v) {
    if (typeof v === 'number') return true;
    return typeof v === 'string' && /^[+\-−]?[\d,]*\.?\d+%?$/.test(v.trim());
  }
  function blank(v) { return v === null || v === undefined || v === ''; }

  var main = document.getElementById('main');

  if (!DATA || typeof DATA !== 'object') {
    main.innerHTML = '';
    main.appendChild(el('div', { class: 'nodata' },
      el('h2', null, '这是模板，还没有嵌入数据'),
      el('p', null, '在仓库根目录运行 python 主线/生成沙盘.py，脚本会读 主线/结论数.json 和 主线/沙盘文字.md，生成 outputs/换电沙盘_v5.html。')));
    document.getElementById('tiers').hidden = true;
    return;
  }

  var TIERS = (Array.isArray(DATA['三档']) && DATA['三档'].length) ? DATA['三档'].map(String) : ['悲观', '中性', '乐观'];
  var cur = TIERS.indexOf(DATA['默认档']) >= 0 ? DATA['默认档'] : TIERS[Math.floor(TIERS.length / 2)];

  function isTierObj(v) {
    if (!v || typeof v !== 'object' || Array.isArray(v)) return false;
    for (var i = 0; i < TIERS.length; i++) if (Object.prototype.hasOwnProperty.call(v, TIERS[i])) return true;
    return false;
  }
  function pick(v) { return isTierObj(v) ? v[cur] : v; }
  function list(v) { return Array.isArray(v) ? v : []; }
  function tierIdx(t) { return String(TIERS.indexOf(t)); }

  // 顶部：版本、示例横条、三档按钮
  var ver = String(DATA['版本'] || '');
  document.getElementById('ver').textContent = ver ? '版本 ' + ver : '';
  if (ver.indexOf('示例') >= 0) document.getElementById('band').hidden = false;

  var tiersBox = document.getElementById('tiers');
  TIERS.forEach(function (t, i) {
    var b = el('button', { type: 'button', 'data-idx': String(i), 'data-tier': t, 'aria-pressed': 'false' }, t);
    b.addEventListener('click', function () { setTier(t); });
    tiersBox.appendChild(b);
  });

  // 各版面顶部说明文字（来自 沙盘文字.md）
  var paras = (TEXT && TEXT['段落']) || {};
  Array.prototype.forEach.call(document.querySelectorAll('.intro[data-text]'), function (box) {
    var h = paras[box.getAttribute('data-text')];
    if (h) box.innerHTML = h; else box.hidden = true;
  });

  function emptyNote() { return el('p', { class: 'empty' }, '（暂无）'); }
  function tierChip() { return el('span', { class: 'chip' }, cur + '档'); }

  // 一、结论
  function renderConclusion() {
    var c = DATA['结论'] || {};
    var box = el('div');
    var one = pick(c['一句话']);
    if (!blank(one)) {
      box.appendChild(el('div', { class: 'verdict' },
        el('div', { class: 'verdict-lbl' }, tierChip(), '一句话结论'),
        el('p', { class: 'verdict-txt pl' }, fmt(one))));
    }
    var ms = list(c['指标']);
    if (!ms.length) { box.appendChild(emptyNote()); return box; }
    var grid = el('div', { class: 'metrics' });
    ms.forEach(function (m) {
      var raw = m['值'], val = pick(raw);
      var vSpan = el('span', { class: 'v' + (looksNumeric(val) || blank(val) ? '' : ' txt') }, fmt(val));
      var card = el('div', { class: 'm' },
        el('div', { class: 'm-name' }, m['名'] || '—'),
        el('div', { class: 'm-val' }, vSpan, m['单位'] ? el('span', { class: 'u' }, m['单位']) : null));
      if (isTierObj(raw)) {
        var strip = el('div', { class: 'm-tiers', 'aria-label': '三档对比' });
        TIERS.forEach(function (t) {
          strip.appendChild(el('span', { class: t === cur ? 'on' : null }, el('b', null, t), fmt(raw[t])));
        });
        card.appendChild(strip);
      }
      var note = pick(m['注']);
      if (!blank(note)) card.appendChild(el('div', { class: 'm-note pl' }, fmt(note)));
      if (!blank(m['出处'])) card.appendChild(el('p', { class: 'src' }, '出处：' + m['出处']));
      grid.appendChild(card);
    });
    box.appendChild(grid);
    return box;
  }

  // 文字表（推翻、跟踪共用）：宽屏是表格，窄屏每行一张卡片
  function textTable(rows, cols) {
    var thead = el('thead', null, el('tr', null, cols.map(function (c) { return el('th', { scope: 'col', style: c.w ? 'width:' + c.w : null }, c.label); })));
    var tbody = el('tbody');
    rows.forEach(function (r) {
      var tr = el('tr');
      cols.forEach(function (c, i) {
        var content = c.render ? c.render(r) : fmt(pick(r[c.key]));
        var isBlank = content === '—' || content === null;
        var td = el('td', { 'data-label': c.label, class: [i === 0 ? 'lead' : '', 'pl', isBlank ? 'blank' : ''].join(' ').trim() });
        append(td, content === null ? '—' : content);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    return el('div', { class: 'tbl-scroll' }, el('table', { class: 'stack' }, thead, tbody));
  }

  // 二、什么会推翻
  function renderOverturn() {
    var rows = list(DATA['推翻']);
    if (!rows.length) return emptyNote();
    return textTable(rows, [
      { key: '参数', label: '参数', w: '16%' },
      { key: '现值', label: '现值', w: '13%' },
      { key: '阈值与后果', label: '阈值与后果', w: '27%' },
      { key: '会不会发生', label: '会不会发生', w: '26%' },
      { key: '跟踪信源', label: '跟踪信源', w: '18%' }
    ]);
  }

  // 三、为什么这么想
  function renderChain() {
    var rows = list(DATA['论证链']);
    if (!rows.length) return emptyNote();
    var ol = el('ol', { class: 'chain' });
    rows.forEach(function (r, i) {
      var meta = el('div', { class: 'meta' });
      var k = pick(r['关键数']);
      if (!blank(k)) meta.appendChild(el('span', { class: 'kv' }, fmt(k)));
      var ref = r['正文'];
      if (!blank(ref)) {
        ref = String(ref).trim();
        meta.appendChild(el('span', null, /^见/.test(ref) ? ref : (/^第/.test(ref) ? '见正文' + ref : '见正文 ' + ref)));
      }
      var one = pick(r['一句话']);
      ol.appendChild(el('li', null,
        el('span', { class: 'no', 'aria-hidden': 'true' }, String(i + 1)),
        el('div', { style: 'min-width:0' },
          el('h3', null, r['环'] || '—'),
          blank(one) ? null : el('p', { class: 'pl' }, fmt(one)),
          meta.childNodes.length ? meta : null)));
    });
    return ol;
  }

  // 四、怎么算出来的：每章一张表，行随档切换；项名前的全角空格或两个半角空格表示下一层
  function splitIndent(v) {
    if (typeof v !== 'string') return { lvl: 0, text: v };
    var m = v.match(/^((?:　| {2})*)/), lead = m ? m[1] : '';
    var lvl = (lead.match(/　/g) || []).length + Math.floor((lead.match(/ /g) || []).length / 2);
    return { lvl: lvl, text: v.slice(lead.length) };
  }
  function renderCalc() {
    var chs = list(DATA['计算链']);
    if (!chs.length) return emptyNote();
    var box = el('div');
    chs.forEach(function (ch) {
      var cols = list(ch['列']);
      var rows = list(pick(ch['行']));
      var width = Math.max(cols.length, rows.reduce(function (a, r) { return Math.max(a, list(r).length); }, 0));
      var numCol = [], fCol = [];
      for (var j = 0; j < width; j++) {
        var seen = 0, nums = 0;
        rows.forEach(function (r) { var v = list(r)[j]; if (!blank(v)) { seen++; if (looksNumeric(v)) nums++; } });
        numCol[j] = j > 0 && seen > 0 && nums === seen;
        fCol[j] = /公式/.test(String(cols[j] || ''));
      }
      var thead = el('thead', null, el('tr', null, Array.from({ length: width }, function (_, j) {
        return el('th', { scope: 'col', class: numCol[j] ? 'num' : null }, cols[j] !== undefined ? cols[j] : '');
      })));
      var tbody = el('tbody');
      if (!rows.length) {
        tbody.appendChild(el('tr', null, el('td', { colspan: String(Math.max(width, 1)), class: 'empty' }, '（这一档没有数据）')));
      }
      rows.forEach(function (r) {
        r = list(r);
        var first = splitIndent(r[0]);
        var tr = el('tr', { class: first.lvl === 0 && rows.length > 1 && rows.some(function (x) { return splitIndent(list(x)[0]).lvl > 0; }) ? 'top' : null });
        for (var j = 0; j < width; j++) {
          var v = j === 0 ? first.text : r[j];
          var cls = numCol[j] ? 'num' : (fCol[j] ? 'f pl' : 'pl');
          var td = el('td', { class: cls }, fmt(v));
          if (j === 0 && first.lvl) td.style.paddingLeft = (12 + first.lvl * 16) + 'px';
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });
      box.appendChild(el('article', { class: 'calc' },
        el('div', { class: 'calc-h' }, el('h3', null, ch['章'] || '—'), isTierObj(ch['行']) ? tierChip() : null),
        blank(ch['问题']) ? null : el('p', { class: 'q pl' }, fmt(pick(ch['问题']))),
        el('div', { class: 'tbl-scroll' }, el('table', null, thead, tbody)),
        blank(ch['出处']) ? null : el('p', { class: 'src' }, '出自 ' + ch['出处'])));
    });
    return box;
  }

  // 五、跟踪
  function renderTrack() {
    var rows = list(DATA['跟踪']);
    if (!rows.length) return emptyNote();
    return textTable(rows, [
      { key: '看什么', label: '看什么', w: '22%' },
      { key: '信源', label: '信源', w: '26%' },
      { key: '什么说明我错了', label: '什么说明我错了', w: '32%' },
      { label: '月度仪表盘', w: '20%', render: function (r) {
        var s = r['仪表盘序列'];
        if (blank(s)) return null;
        return el('span', null, el('a', { href: DASHBOARD }, '见月度仪表盘'),
                el('span', { class: 'cell-sub' }, '序列：' + s));
      } }
    ]);
  }

  var parts = [
    ['b-jielun', renderConclusion],
    ['b-tuifan', renderOverturn],
    ['b-lunzheng', renderChain],
    ['b-jisuan', renderCalc],
    ['b-genzong', renderTrack]
  ];
  function renderAll() {
    parts.forEach(function (p) {
      var host = document.getElementById(p[0]);
      var node;
      try { node = p[1](); }
      catch (e) { node = el('p', { class: 'empty' }, '这一块数据格式有误，未能显示：' + e.message); }
      host.replaceChildren(node);
    });
  }
  function setTier(t) {
    if (TIERS.indexOf(t) < 0) return;
    cur = t;
    document.body.setAttribute('data-tier', tierIdx(t));
    Array.prototype.forEach.call(tiersBox.children, function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-tier') === t ? 'true' : 'false');
    });
    renderAll();
  }

  // 页脚：数据和文字分别来自哪个文件
  var src = (TEXT && TEXT['来源']) || {};
  var foot = document.getElementById('foot');
  var bits = [];
  if (src['数据']) bits.push('数字来自 ' + src['数据']);
  if (src['文字']) bits.push('说明文字来自 ' + src['文字']);
  bits.push('由 主线/生成沙盘.py 生成');
  foot.textContent = bits.join('；') + '。';

  // 固定条高度 → 锚点跳转时不被遮住
  var bar = document.getElementById('bar');
  function syncHeader() { document.documentElement.style.setProperty('--hdr-h', bar.offsetHeight + 'px'); }
  if (window.ResizeObserver) new ResizeObserver(syncHeader).observe(bar);
  window.addEventListener('resize', syncHeader);

  setTier(cur);
  syncHeader();
})();
</script>
</body>
</html>
