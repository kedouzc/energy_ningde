min_swap_increment_yi.v = 1000.0            # 千亿量级才谈得上「重注」
min_swap_increment_yi.label = "重注门槛·增量价值下限"
min_swap_increment_yi.unit = "亿元"
min_swap_increment_yi.decimals = 0
min_swap_increment_yi.note = "千亿量级才谈得上「重注」；判断值不是测量值"
min_increment_over_mktcap.v = 0.10          # 增量价值占集团市值 ≥10% 才配占用战略敞口
min_increment_over_mktcap.label = "战略敞口门槛·增量占集团市值下限"
min_increment_over_mktcap.unit = "%"
min_increment_over_mktcap.decimals = 0
min_increment_over_mktcap.scale = 100.0
min_increment_over_mktcap.note = "增量价值占集团市值 ≥10% 才配占用战略敞口；判断值不是测量值"
target_increment_over_mktcap.v = 0.20       # ≥20% 才算值得重注
target_increment_over_mktcap.label = "值得重注·增量占集团市值目标"
target_increment_over_mktcap.unit = "%"
target_increment_over_mktcap.decimals = 0
target_increment_over_mktcap.scale = 100.0
target_increment_over_mktcap.note = "≥20% 才算值得重注；判断值不是测量值"
max_bet_share_low = 0.50                  # 押注占比 <50% 可坦然辩护
