[operating_demand]
# 用于乘用营运车数量推算，从需求里程池起算，背景：
# 现状牌照约450万（网约320万运输证 + 出租139万）含大量低活跃"睡眠车"，直接采用会高估；
# 且 Robotaxi 到2030会吃掉一部分有人车运力，故先估里程池再反推真实活跃车数。
passenger_trips_2025_yi = 344.82      # 2025出租汽车客运量(巡游+网约) 亿人次/年 [2025交通运输部统计公报](https://www.thepaper.cn/newsDetail_forward_32501028)
average_trip_km = 9.0                 # 单次平均运距 km/单；行业普遍 8–10km（[武汉 Robotaxi 每单约 10km 参考](https://finance.sina.cn/2024-07-22/detail-inceyhum1612221.d.html)
# T₀里程池 = 344.82亿 × 9 ≈ 3,100亿车·km；按出行需求年增3%外推5年至2030
# 依据：网约车GMV 17.5% CAGR，但里程池增速远低于GMV，取3%保守 [网约车GMV参考](https://www.sohu.com/a/943333317_120244537)
pool_2030_yi_km = 3500.0              # 2030有人+Robotaxi总里程池 亿车·km/年（已含3%年增外推）
robotaxi_fleet_wan = 50.0             # 2030 Robotaxi保有 万辆：[高盛](https://baijiahao.baidu.com/s?id=1831537924018727671)/[东吴](https://blog.csdn.net/lmj1689120/article/details/153782397)/[巴克莱30-50万](https://www.toutiao.com/article/7535654361658130959/)
