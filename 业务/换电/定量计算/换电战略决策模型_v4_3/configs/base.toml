# ----------------------中检点·跟踪卡（漏斗每一层都要有岗）----------------------
#
# 【2026-09-16 卡片化】此前 `tracker.check()` 里的比对是**硬编码**的：加一层跟踪要改程序。
# 现在每张 `[[watch]]` 卡 ＝ 一个中检点，程序只负责遍历。**加一层跟踪＝加一张卡。**
#
# 为什么要盯整条漏斗而不只盯最后一层：车辆规模是
# 总量 → 分车型 → 电动化 → 换电占纯电 → CATL 份额 一条链，
# **只盯最下游等于只在最后一道关口设岗**——上游任何一层偏了，
# 都要等它传导到重卡换电才看得见，而那时已经晚了一整年。
#
# 字段：
#   model      模型假设住哪（点分路径；`calc:` 前缀＝需要程序算的复合值）
#   observed   实测读数住哪（`audit/tracking_<源>.json` 的 layers.<层>.<键>，
#              路径首段可写源名如 `methanol.甲醇.latest_ratio`；不写默认 hdt）；
#              留空＝**数据源还没接**
#   unit       展示单位（必填）：% ｜ 万辆 ｜ 元/kWh ｜ 座……**不许让前端按数值猜量级**
#   decimals   展示小数位（% 建议 1，元/kWh 服务费 2，座 0）
#   compare    diff（绝对差）｜ ratio（模型 ÷ 实测 的倍数）
#   threshold  越过即报警
#   direction  model_high（只在模型偏高时报）｜ model_low ｜ either
#   period     复核周期——**竞争性变量必须有，结构性常数可以没有**
#   why        越阈值说明什么、该做什么
#   group      可选：报警归组名。同 group 的多张卡同时报警时，沙盘 ② **合并成一条**、
#              各卡以 role 分行展示（例：重卡电动化的累计口径/单月口径是一个变量的
#              两副眼镜，分卡是为了判定逻辑各自独立，合并展示是为了读者不把它们看成
#              两条互相冲突的报警）；不写＝独立报警
#   role       可选：在组内的角色名（如「累计口径·重标锚」「单月口径·调仓边际」），
#              跟踪表层名后也会带上它；写了 group 就必须写 role

[[watch]]
id = "hdt_electrification"
layer = "重卡·电动化"
group = "重卡·电动化（累计锚 / 单月边际两副眼镜）"
role = "累计口径 · 曲线重标锚"
model = "vehicles.heavy.nev_anchor_rate"
observed = "重卡.latest_nev_pen_cum"
unit = "%"
decimals = 1
compare = "diff"
threshold = 0.03
direction = "model_low"
period = "月度"
why = "实测高出拟合锚，说明曲线该重标——**改锚即可，k/t0 自动重算**，不要手改 nev_rates"

[[watch]]
id = "hdt_swap_share"
layer = "重卡·换电占纯电"
group = "重卡·换电占纯电（累计锚 / 单月边际两副眼镜）"
role = "累计口径 · 趋势确认锚"
model = "calc:heavy_swap_penetration_weighted"
observed = "重卡.latest_swap_share_cum"
unit = "%"
decimals = 1
compare = "diff"
threshold = 0.10
direction = "either"
period = "月度"
why = "模型假设它会从实测水平反转回升。**这不是 bug，是一个反转预期**——三条推翻条件写在 swap_penetration 声明段，机制与三条反驳见 topics/竞争格局「换电占电动为什么在跌」"

[[watch]]
id = "private_pool_path"
layer = "私家车池·增长路径"
model = "vehicles.private.annual_net_additions_wan.0"
observed = "乘用车.bev_annualized_wan"
unit = "万辆"
decimals = 1
compare = "ratio"
threshold = 1.6
direction = "model_high"
period = "月度"
why = "**净增是存量增量、销量是流量，净增不可能超过销量。** 口径本身没问题（私家车池分母取公安部纯电保有量口径，已排除插混），要核的是这条增长路径的依据。影响量化见沙盘②「私家车敏感性」"

[[watch]]
id = "service_fee"
layer = "经营·换电服务费"
model = "swap_business.service_fee_rmb_kwh"
observed = ""
unit = "元/kWh"
decimals = 2
compare = "diff"
threshold = 0.05
direction = "model_high"
period = "月度"
why = "**数据源未接。** 它是经济门的翻转轴之一（跌到某个价门就红），且是「换电占电动为什么在跌」那条假说的三重角色指标。接入前这张卡只起登记作用——**空着比没有好，因为空着是看得见的**"

[[watch]]
id = "battery_price_curve"
layer = "成本·电池价格曲线"
model = "construction.battery_price_curve.base_price_rmb_kwh"
observed = ""
unit = "元/kWh"
decimals = 1
compare = "diff"
threshold = 30.0
direction = "either"
period = "月度"
why = "**数据源未接。** 模型假设 2028 前平台、2029 起年降 4%、2033 起 2.75%。电池价是全周期资本的大头，价格路径偏了，资本与残值两头一起动"

[[watch]]
id = "catl_own_buildout"
layer = "执行·CATL 自建进度"
model = "construction.station_2026_cumulative_targets.choco"
observed = ""
unit = "座"
decimals = 0
compare = "ratio"
threshold = 1.3
direction = "model_high"
period = "月度"
why = "**数据源未接，但这是最要紧的一张卡。** 模型硬断言站网在建成目标年建完、兑现年要 14,798 座。**对手慢了不致命，自己慢了整条论证就塌了。** 数据靠公司通稿（国家能源局/充电联盟的充换电月度统计里不含换电站，没有权威月度源）"

# ── 2026-09-16 补齐：漏斗全岗＋单月/年化双轨 ────────────────────────────
# 单月卡＝边际信号（为调仓服务，生产资料季节性再强也必须当月跟）；
# 累计/年化卡＝趋势锚（曲线重标以它为准）。同一变量两轨并存，互不替代；
# 但报警展示用 group 合并成一条（role 分行），免得两副眼镜被读成两条互相矛盾的报警
# （2026-09-16e：此前累计 28.9%/单月 35.0% 并列出现，读者以为模型自相矛盾）。

[[watch]]
id = "city_logistics_annual"
layer = "城配·物流车电动化（年化）"
model = "calc:city_annual_ev_wan"
observed = "城配.logistics_annualized_wan"
unit = "万辆"
decimals = 1
compare = "diff"
threshold = 15.0
direction = "either"
period = "月度"
why = "模型分母是城配全口径保有 1,500 万辆；实测是电车资源 NEV 物流车七类上险（不含重卡/皮卡/客车，含中卡），**口径天然窄一截**。模型持续高出阈值＝分母或当年 NEV 率该重标；实测反超模型＝需求上修信号"

[[watch]]
id = "pool_total_ceiling"
layer = "总量·四池流量天花板"
model = "calc:pool_flows_total_wan"
observed = "总量.nev_annualized_wan"
unit = "万辆"
decimals = 1
compare = "diff"
threshold = 100.0
direction = "model_high"
period = "月度"
why = "**漏斗天花板：模型覆盖的五个车池当年电动化流量之和不可能超过全国 NEV 总盘**（私家取净增、天然≤销量，方向已保守）。越线必然是某一池假设过大——当前差额几乎全部来自私家车净增路径，逐池拆差见各分卡。实测为中汽协国内口径（不含出口）"

[[watch]]
id = "battery_install_annual"
layer = "电池·全国装车量（年化）"
model = "calc:national_install_gwh_current_year"
observed = "电池份额.install_annualized_gwh"
unit = "GWh"
decimals = 1
compare = "diff"
threshold = 150.0
direction = "either"
period = "月度"
why = "模型是 2025 实际 769.7 → 兑现年 1,350 的线性年中值；实测是联盟装车 YTD 年化。**下半年装机季节性偏强、年初年化系统性偏低，越年末越可比**；到四季度仍越阈值，说明装车大盘路径需重标"

[[watch]]
id = "commercial_catl_share"
layer = "电池·商用车 CATL 份额"
model = "calc:commercial_catl_share_model"
observed = "电池份额.latest_catl_commercial"
unit = "%"
decimals = 1
compare = "diff"
threshold = 0.15
direction = "either"
period = "月度"
why = "**口径宽，只作 plausibility 锚，不当同口径比对**：模型是换电体系内 CATL 标准份额（重卡并购启源后 80%、城配 80%，按换电流量加权），实测是联盟口径 CATL 占全部商用车装车。要盯的是**差距的趋势**：实测持续上行＝体系外竞争力外溢，持续下行才需回看 80% 是否乐观"

[[watch]]
id = "hdt_electrification_monthly"
layer = "重卡·单月电动化（边际）"
group = "重卡·电动化（累计锚 / 单月边际两副眼镜）"
role = "单月口径 · 调仓边际信号"
model = "vehicles.heavy.nev_rates.0"
observed = "重卡.latest_nev_pen_m"
unit = "%"
decimals = 1
compare = "diff"
threshold = 0.08
direction = "model_low"
period = "月度"
why = "**单月看边际、累计看重标**：重卡是生产资料、季节波动大，但跟踪为调仓服务，边际变化必须当月响。单月连续高出阈值＝曲线领先信号（先看月度仪表盘判趋势）；是否重标锚以累计卡 hdt_electrification 为准"

[[watch]]
id = "hdt_swap_share_monthly"
layer = "重卡·单月换电占纯电（边际）"
group = "重卡·换电占纯电（累计锚 / 单月边际两副眼镜）"
role = "单月口径 · 拐点先行信号"
model = "calc:heavy_swap_penetration_weighted"
observed = "重卡.latest_swap_share_m"
unit = "%"
decimals = 1
compare = "diff"
threshold = 0.12
direction = "either"
period = "月度"
why = "反转预期（兑现年加权 44.8%）的高频检验：单月比累计更早反映拐点。**判据仍是连续 4 期不回升则下修**（三条反驳见 vehicles.heavy.scenes 声明段）——单月卡负责当月提示，趋势确认以累计卡 hdt_swap_share 为准"

# ----------------------体检指标（非决策框架）-----------------------------
# 语义降级说明（MANIFEST §1.1 历史注记+演进链 §8.11）：v4.2 将此三阈值当决策框架，
# 实为遗留缺省值、无拍板记录。v4.3 保留作"投入产出关系刻度"，供报告体检对照，
# 决策叙事以 MANIFEST §1.0/§1.1 为准（做多大/代价/回报/资金从容度）。
[decision_thresholds]
max_peak_swap_cash_to_cfo.v = 0.15
max_peak_swap_cash_to_cfo.label = "现金投入占比体检线"
max_peak_swap_cash_to_cfo.unit = "%"
max_peak_swap_cash_to_cfo.decimals = 0
max_peak_swap_cash_to_cfo.scale = 100.0
max_peak_swap_cash_to_cfo.note = "峰值现金÷CFO，集团内部风险口径，判断值不是测量值"
min_forward_to_required_ebitda.v = 1.00
min_forward_to_required_ebitda.label = "EBITDA 覆盖倍数体检线"
min_forward_to_required_ebitda.unit = "倍"
min_forward_to_required_ebitda.decimals = 2
min_forward_to_required_ebitda.note = "稳态 EBITDA ÷ 资本要求回报的体检线（与 swap.coverage 同公式、阈值性质）；判断值不是测量值。**2026-09-15 起门槛 ≡ WACC**，所以覆盖 1.0 ＝ 刚好赚回资本成本，不是盈亏平衡；安全边际不焊在门槛里，由余量与「要求回报翻转轴」表达"
min_swap_value_creation_multiple = 3.00
min_light_asset_value_retention = 0.80
min_light_asset_recurring_profit_retention = 0.70
max_funding_exposure_coverage_ratio = 1.00
# 一页纸的判断阈值（2026-09-09：原硬编码在 src/onepager.py 的解释列里，搬到此处成为唯一家；
