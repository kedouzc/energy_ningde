# ============================================================================
# 换电战略决策模型 v4.3 — 基础参数配置
# ============================================================================
# 本文件是 MANIFEST.md 的机器可读提取物：只存数值 + 一行结论 + 锚点。
# 完整论证（推导链、信源核验、演进历史）一律住在 MANIFEST.md，勿在此展开。
# 审计依据：audit/信源审计台账.md——全部信源已在台账核验闭环，本文件直接引用其结论。
#
# 计算链路（分区即按此排序）：
#   车辆层[vehicles] → 站点层[stations] → 建设排期[construction] →
#   运营层[swap_business]+[ancillary_services] → 电池层[battery_life_model]+价格曲线 →
#   充电段份额[charge_share] → 财务[finance] → 资金层[group_funding] →
#   资本承诺 → 战略敞口 → 轻资产 → 参照公司卡片 → 并购情景[mna] → 体检指标
# ============================================================================

[meta]
model_name = "换电战略决策模型_v4.3"
model_version = "4.3"
version_date = "2026-08-29"
reference_year = 2026
target_year = 2030
currency = "亿元人民币"
base_scenario = "中性"
# 决策问题（MANIFEST §1.1）："做不做"已由定性分析解决（§1.0），本模型回答"做透=做多大"：
# 规模、代价、增量价值、资金从容度四个数。

[modeling.rounding]
# 毛估估取整纪律：只在自然业务节点取整（终局车辆数/频次保留1位小数后反推站数），
# 年度批次、折旧、税盾内部保留精度，防止累计取整偏差。
terminal_vehicle_decimals = 1
terminal_frequency_decimals = 1
report_money_decimals = 1

# ----------------------情景驱动因子 [drivers]-------------------------------
# 为什么要有这一段：DECISIONS「2026-09-02 · 「三情景」名不副实」。
#   此前情景信息在本文件里有**五种互不相通的写法**：全局标签（meta.base_scenario）／
#   显式字典（vehicles.private.scenario_swap_penetration）／scenario 字段（charge_share）／
#   列表靠位置（原 service_fee_scenarios_rmb_kwh）／**只写在注释里**（mfg_margin）。
#   程序读不到注释，于是 tree.py 只能再硬编码一份常量 —— 那是第六份，也是「第二个家」的成因。
#   现在统一到这一段：**情景定义只有一个家**。
#
# 三条纪律（DECISIONS 同条）：
#   ① 谁是情景轴是「声明」不是测量。声明写在这里；lab.py 的弹性只用来**审计**它
#      —— 声明的轴弹性≈0 → 白设了；没声明的参数弹性最大 → 漏了一个轴。
#   ② 一个 driver 扇出到若干同源参数，三档整体切换；**只让同源参数联动**，
#      不许全部参数一起变好变坏（那等于假设完全正相关，区间会宽到没有意义）。
#   ③ 中性档必须**严格等于模型基线**——不改任何参数即基线。
#
# 字段：target = 写入的 config 点分路径；pass_as = 作为 build_model 关键字参数传入
#       （不落 config，避免与参数本体形成第二个家）。
# 本段只声明档位、不参与计算，故 lab.py 扫描时跳过（_SKIP_SECTIONS）。

# ───────────────────────────────────────────────────────────────────────
# 每个可调参数（或每条轴）的「一个家」：中文语义 + 三档情景 + 可选区间，放一起。
# 看一个参数，它的三种情景值是否落在区间内、对应什么中文含义，一眼全有。
#   · 区间 bounds：硬约束。调参滑块不许出界、反解也只在区内求解。
#   · 三档：在「区间之内」挑的两个判断点（区间外 = 档位拍得比现实还激进）。
#   · 单目标轴（fee_level/mfg_margin/valuation_multiple）：一块说清一个参数。
#   · 多目标轴（commercial_swap_share 等）：三档是「整体 ×倍数」的乘数，
#     必须留在轴级别（拆成各参数各自三档就破坏"同源联动"了）；cn/bounds 仍挂本块。
#   · 相对模式（relative）的 bounds 是「乘数的允许范围」；绝对模式是「取值的允许范围」。
# ───────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────
# ① 规模轴：决定"能覆盖多少辆车"。scale.py 的计算漏斗就是这三层比率：
#      NEV渗透率 → 换电占有率 → CATL换电市占率
#    这三条既是最大的杠杆，也是最容易用市场销量校验的先行指标，故排在最前。
#  两套语义，各有其用、不要混：
#    · 悲观/中性/乐观（乘数）→ 三情景档位，apply_scenario 乘基线写入，进报告/决策树；
#    · axis_step            → 沙盘滑块的**绝对加减**步长（份额/渗透率＝百分点），
#      滑块只受 [0, cap] 硬边界约束，不被三档封顶——三档只是"判断参考点"，不是边界。
# ───────────────────────────────────────────────────────────────────────

[drivers.commercial_nev_penetration]
cn      = "纯电渗透率(NEV)"
unit    = "电动化率"
desc    = "各车型 nev_rates S 曲线整体平移。中性=1.0，悲观/乐观整体平移电动化节奏；cap=1.0 任何年份渗透率不破 100%。"
mode    = "relative"
step    = 0.05               # 沙盘滑块步长：每年渗透率整体加减 0.05（绝对，非乘法）
"悲观"   = 0.85
"中性"   = 1.00
"乐观"   = 1.15
cap     = 1.0
bounds  = [0.50, 1.15]   # 乘数的允许范围
targets = [
  "vehicles.heavy.nev_rates",
  "vehicles.city.nev_rates",
  "vehicles.taxi.nev_rates",
  "vehicles.ridehail.nev_rates",
]

[drivers.commercial_swap_share]
cn      = "换电在纯电中的渗透率"
unit    = "换电/纯电"
desc    = "技术迭代摆动：换电在 NEV（重卡/城配）里的占有率。中性=1.0（不动基线），悲观/乐观按 ±30% 整体平移各场景换电渗透率。商用绝对保有量等宏观固定、不作轴。"
mode    = "relative"
step    = 0.05               # 沙盘滑块步长：各场景换电渗透率整体加减 0.05（绝对，非乘法）
"悲观"   = 0.70
"中性"   = 1.00
"乐观"   = 1.30
cap     = 1.0        # 份额/渗透率不得破 100%（与 commercial_nev_penetration、catl_swap_share 同口径）
bounds  = [0.50, 1.50]   # 乘数的允许范围
targets = [
  "vehicles.heavy.scenes.0.swap_penetration",
  "vehicles.heavy.scenes.1.swap_penetration",
  "vehicles.heavy.scenes.2.swap_penetration",
  "vehicles.city.scenes.0.swap_penetration",
  "vehicles.city.scenes.1.swap_penetration",
]

[drivers.catl_swap_share]
cn      = "CATL换电市占率"
desc    = "竞争格局摆动：各场景 catl_swap_share。中性=1.0，悲观/乐观整体平移 CATL 份额；cap=1.0 市占率不破 100%（robotaxi 已 100%）。"
mode    = "relative"
step    = 0.05               # 沙盘滑块步长：各场景 CATL 份额整体加减 0.05（绝对，非乘法）
"悲观"   = 0.85
"中性"   = 1.00
"乐观"   = 1.15
cap     = 1.0
bounds  = [0.50, 1.15]   # 乘数的允许范围（须容纳自身乐观档 1.15，否则档位落在区间外）
targets = [
  "vehicles.heavy.scenes.0.catl_swap_share",
  "vehicles.heavy.scenes.1.catl_swap_share",
  "vehicles.heavy.scenes.2.catl_swap_share",
  "vehicles.city.scenes.0.catl_swap_share",
  "vehicles.city.scenes.1.catl_swap_share",
  "vehicles.taxi.scenes.0.catl_swap_share",
  "vehicles.ridehail.scenes.0.catl_swap_share",
  "vehicles.robotaxi.scenes.0.catl_swap_share",
  "vehicles.private.scenes.0.catl_swap_share",
  "vehicles.private.scenes.1.catl_swap_share",
  "vehicles.private.scenes.2.catl_swap_share",
]

# ───────────────────────────────────────────────────────────────────────
# ② 私家车换电接受度（分价格带）
# ───────────────────────────────────────────────────────────────────────

[drivers.private_penetration]
cn      = "私家车换电接受度"
unit    = "换电渗透率"
step    = 0.01                # 沙盘滑块步长＝1 个百分点（其余轴默认 0.05）
bounds  = [0.0, 1.0]          # 渗透率硬边界：再乐观也不能超过 100%，不被三档卡死
desc    = "私家车分价格带换电渗透率，三档向量直接住在本轴。此前数值住在 vehicles.private.scenario_swap_penetration、本轴只路由情景名——数值的第二个家，已融合。分量键＝价格带（＝场景 name）。"
targets = [
  "vehicles.private.scenes.0.swap_penetration",
  "vehicles.private.scenes.1.swap_penetration",
  "vehicles.private.scenes.2.swap_penetration",
]
"悲观" = { "8万元以下" = 0.00, "8至15万元" = 0.03, "15万元以上" = 0.00 }
"中性" = { "8万元以下" = 0.00, "8至15万元" = 0.05, "15万元以上" = 0.03 }
"乐观" = { "8万元以下" = 0.03, "8至15万元" = 0.08, "15万元以上" = 0.05 }

# ───────────────────────────────────────────────────────────────────────
# ③ 充电份额——影响充电侧，与规模轴分列
# ───────────────────────────────────────────────────────────────────────

[drivers.charge_share]
cn      = "CATL充电市占率"
unit    = "份额"
desc    = "充电业务线里 CATL 的市占率（与换电虹吸/标准锁定无关，换电侧份额由 CATL换电市占率轴决定）。逐车型三档份额：悲观＝充分竞争未保护；中性＝(悲观+乐观)/2 派生；乐观＝标准锁定后能保持。中性档口径＝各车型无换电谱系：重卡0.45／城配·出租·网约·Robotaxi 0.40／私家0.35。"
targets = [
  "charge_share.heavy",
  "charge_share.city",
  "charge_share.taxi",
  "charge_share.ridehail",
  "charge_share.robotaxi",
  "charge_share.private",
]
"悲观" = { heavy = 0.35, city = 0.35, taxi = 0.35, ridehail = 0.35, robotaxi = 0.40, private = 0.30 }
"中性" = { heavy = 0.45, city = 0.40, taxi = 0.40, ridehail = 0.40, robotaxi = 0.40, private = 0.35 }
"乐观" = { heavy = 0.55, city = 0.45, taxi = 0.45, ridehail = 0.45, robotaxi = 0.40, private = 0.40 }
# 悲观档依据：宁德国内份额 52.1%(2021)→45.08%(2024)→37.1%(2025 1-8月)持续下滑。
# 乐观档据：标准锁定成立（换电车辆物理锁定 CATL 块）。
# robotaxi 全量换电(swap_pen=1)：有换电侧充电段份额恒为0；此处0.40仅用于无换电反事实纯制造口径，故无情景区间。

# ───────────────────────────────────────────────────────────────────────
# ④ 价格与运营（涉及推广难度，不好调——列在规模轴之后）
# ───────────────────────────────────────────────────────────────────────

[drivers.fee_level]
cn      = "换电服务费"
unit    = "元/kWh"
desc    = "CATL 自主定价。谱系：焦作商车邦实测 0.2（价格战）／齐鲁晚报行业 0.3–0.4／开源短倒 0.4。中枢 0.30 居中偏稳健。"
target  = "swap_business.service_fee_rmb_kwh"
bounds  = [0.20, 0.40]
step    = 0.1
"悲观"   = 0.20
"中性"   = 0.30      # 必须等于模型基线（apply_scenario 中性档断言校验）
"乐观"   = 0.40

[drivers.battery_rent]
cn      = "电池银行月租金"
unit    = "元/kWh·月"
desc    = "电池银行的月租金定价（配置值就是月租；年租 = 月租 × 12，换算在计算处）。"
target  = "swap_business.battery_rent_rmb_kwh_month"
bounds  = [8.0, 12.0]
step    = 0.5
"悲观"   = 8.0
"中性"   = 10.0
"乐观"   = 12.0

[drivers.valley_power_price]
cn      = "谷电单价"
unit    = "元/kWh"
# 【方向】它是**成本项**，与收益类参数相反：三档是"投资价值"的三档，
# 谷电越贵→充电成本越高→投资价值越低。故乐观档取**低价**、悲观档取**高价**。
# （2026-09-09 修正：原填成 悲观0.20/乐观0.40，导致"一键乐观"反而抬高成本、压低价值。）
desc    = "谷段电价，影响充电成本与电池银行收益。区间比三档略宽（阈值比上下两档大一点）。注意它是成本项：价越低投资价值越高，故乐观＝低价。"
target  = "swap_business.valley_power_price_rmb_kwh"
bounds  = [0.10, 0.50]
step    = 0.1
"悲观"   = 0.40
"中性"   = 0.30
"乐观"   = 0.20

# ───────────────────────────────────────────────────────────────────────
# ⑤ 制造与估值
# ───────────────────────────────────────────────────────────────────────

[drivers.mfg_margin]
cn      = "换电对制造净利率的保护"
unit    = "（占无换电净利率的上浮）"
desc    = "有换电净利率 ＝ 无换电 12.5% ＋ 上浮（悲观无保护→12.5%／中性 +1.0pct→13.5%／乐观 +2.5pct→15%）。"
target  = "swap_business.with_swap_manufacturing_net_margin"
bounds  = [0.125, 0.150]
step    = 0.005
"悲观"   = 0.125
"中性"   = 0.135
"乐观"   = 0.150

[drivers.valuation_multiple]
cn      = "换电运营 EV/EBITDA 倍数"
desc    = "反映「非共识→共识」的市场激烈程度。悲观13＝以制造为基础的倍数（CATL 自身 LTM 13.0×）；乐观22＝比肩轻资产资管平台型上限。"
target  = "finance.swap_ev_ebitda"
bounds  = [13.0, 22.0]
step    = 1.0
"悲观"   = 13.0
"中性"   = 18.0      # 与 finance.swap_ev_ebitda 基线一致
"乐观"   = 22.0

[drivers.construction_ownership]
cn      = "CATL持股比例"
structure = true    # 资本结构参数，非经营价值驱动；不进"档位方向＝投资价值"机械校验
desc    = "建设期自持比例。下参考蔚能 27.8% 实控，上下界围绕 40% ±10pct。"
target  = "finance.construction_ownership"
bounds  = [0.3, 0.5]
step    = 0.05
"悲观"   = 0.3
"中性"   = 0.4
"乐观"   = 0.5

[drivers.debt_ratio]
cn      = "项目负债率"
structure = true    # 资本结构参数（债/股比），非经营价值驱动；不进"档位方向＝投资价值"机械校验
desc    = "项目资本结构（债/股比）：本模型项目权益价值＝EV−债务，故杠杆越高、债越多、CATL 权益价值切片越小（债融更多、自有权益更少）——这是正确代数，不是 bug。'放大'指单位权益撬动的网络/ROE（已在 DCF 分支含税盾体现），而非权益价值本身。低于 50% 银行不接、高于 75% 风险过高。"
target  = "finance.debt_ratio"
bounds  = [0.50, 0.75]
step    = 0.05
"悲观"   = 0.50
"中性"   = 0.60
"乐观"   = 0.75

[drivers.manufacturing_pe]
cn      = "制造业务 PE"
desc    = "制造业务估值可用 PE 区间。"
target  = "finance.manufacturing_pe"
bounds  = [15.0, 25.0]
step    = 1.0
"悲观"   = 15.0
"中性"   = 20.0
"乐观"   = 25.0

# ------------------敏感性扫描的设置（lab.py 读）------------------------
[sensitivity]
# ★ 微扰幅度 step：lab 把每个参数单独"+(step×100)%"来量它的敏感度。
# 这是**测量用的尺子，不是情景、不是预测**——改大改小只影响灵敏度读数的精度，
# 不改变"谁重要谁不重要"的排序。一般保持 0.10 即可。
# 真正要校准的是 [drivers.*] 里的悲观/乐观档位，跟这里无关（三者别搞混）。
# 改名 perturb：它是"测量用的尺子"，与 [drivers.*].step（滑块步长）**不是一回事**。
perturb = 0.10

# 这些不是"假设"、没有可调区间（是事实/制度/会计常量），故不进扫描、
# 不出现在 01_假设参数 表——避免把根本不能动的数当成可调旋钮摆在那儿。
# 想让某个数重新参与敏感性分析，把它从下面删掉即可（无需改代码）。
not_adjustable = [
  # 场景结构量：不是"假设"，调它没有业务含义——权重合计恒为 1（互为约束，不能单扫），
  # 单车带电量/日均里程是车型物理参数。支持通配（* 单层、? 单字符），
  # 免得为 30+ 个场景逐个抄路径。
  "vehicles.*.scenes.*.weight",
  "vehicles.*.scenes.*.onboard_battery_kwh",
  "vehicles.*.scenes.*.daily_km",
  "vehicles.*.battery_kwh",
  "vehicles.*.daily_km",
  "operating_demand.*_daily_km",
  "swap_business.no_swap_manufacturing_net_margin",  # 纯制造基准 12.5%，是口径不是可调假设
  "vehicles.robotaxi.scenes.*.swap_penetration",  # Robotaxi 全量换电，恒为 1，是定义不是假设
  "vehicles.*.scenes.*.energy_consumption_kwh_km",  # 单位电耗：车型物理参数
  "vehicles.*.energy_consumption_kwh_km",
  "swap_business.operating_days",   # 350 天＝营运车全年营运留 15 天检修/极端天气停运，是运营事实不是假设
  "swap_business.rte",              # 充放电效率是运营事实，不是假设参数
  "vehicles.heavy.stock_wan",      # 重卡保有量是运营事实，不是假设参数
  "vehicles.city.stock_wan",        # 城配保有量是运营事实，不是假设参数
  "operating_demand.taxi_stock_wan",    # 出租保有量是运营事实，不是假设参数
  "vehicles.private.annual_net_additions_wan",    # 私家车年增量是共识数据
  "vehicles.heavy.existing_catl_swap_stock_wan",    # catl换电重卡存量是运营事实，不是假设参数
  "vehicles.heavy.pure_electric_share",  # 电动重卡中的纯电占比，不需要敏感性分析
  "vehicles.city.pure_electric_share",  # 纯电城配占比，不需要敏感性分析
  "vehicles.private.pure_electric_share",  # 纯电私家车占比，不需要敏感性分析
  "vehicles.robotaxi.pure_electric_share",  # 纯电robotaxi占比，不需要敏感性分析
  "vehicles.heavy.replacement_cycle_years",  # 重卡更新周期是共识数据
  "vehicles.city.replacement_cycle_years",  # 城配更新周期是共识数据
