[stations.heavy]
label = "骐骥重卡站"
# 站体本身（不含站内周转电池）的单座初装CAPEX；用于年度站体CAPEX。
station_body_capex_wan = 500.0
# 单站周转库存：块数×单块电量决定站内电池GWh，进一步进入电池CAPEX、更新和折旧。
inventory_blocks = 24.0
block_kwh = 171.0
# 站内周转电池寿命；决定全周期重置次数与EAC式资本倍数。
battery_life_years = 5.7
# 以下三项只用于校验单站物理上限：工位上限与充电能量上限取较小值。
charging_power_kw = 4500.0
operating_hours_day = 16.0
swap_duration_seconds = 300.0
# 模型用于反推站数的外生规划能力。重卡192次/日有官方16小时、5分钟/车口径支撑。
planning_daily_capacity = 192.0

[stations.choco]
label = "巧克力站"
# 站体本身（不含站内周转电池）的单座初装CAPEX。
station_body_capex_wan = 200.0
# 官方披露单站14—30块，基准取下沿14块；与56kWh共同决定站内库存CAPEX。
inventory_blocks = 14.0
block_kwh = 56.0
battery_life_years = 3.8
# 物理校验参数：可推出工位上限864次/日、能量上限约552次/日。
charging_power_kw = 1120.0
operating_hours_day = 24.0
swap_duration_seconds = 100.0
# 300次/日不是由“严格设计冗余度”推导的工程参数，而是v3.2沿用的规划拍值。
# 它只作站数反推分母；程序同时校验300不得超过上述物理上限，不再倒算伪造1.84倍冗余。
planning_daily_capacity = 300.0

[construction]
years = [2026, 2027, 2028, 2029, 2030]
station_network_completion_year = 2028
# 2025年底已经建成的站体。它们属于终局总资产的一部分，但不是2026年新增现金支出。
opening_2025_stations = { heavy = 305, choco = 1020 }
# 模型建设排期：2026累计达到约1000/3000座，剩余需求站数在2028前补齐。
station_2026_cumulative_targets = { heavy = 1000, choco = 3000 }
# 公司公开规划原值，只用于报告披露对照，不直接替代需求反推站数。
official_2026_station_plan = { heavy = 900, choco = 3000 }

[construction.battery_price_curve]
# 2026换电专用LFP Pack含税价格，是初装及后续更新电池CAPEX的价格起点。
base_price_rmb_kwh = 590.0
# 价格曲线三阶段：平台期保持基价；快速下降期；之后慢速下降期。
platform_end_year = 2028
rapid_decline_end_year = 2033
rapid_annual_decline_rate = 0.04
slow_annual_decline_rate = 0.0275
# 退役回收：储能Pack/动力Pack价格比×退役SOH×二手交易折价。
# 这三项共同生成“退役回收率”，用于更新净CAPEX；不是直接输入期末残值率。
storage_to_power_price_ratio = 0.917
retirement_soh = 0.80
# 观察期末仍在役电池按年衰减估算SOH；与届时价格共同派生期末残值率和折旧基数。
annual_soh_decline_rate = 0.02
secondary_market_discount = 0.60

