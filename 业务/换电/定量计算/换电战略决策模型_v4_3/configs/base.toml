# 各车型/场景的 battery_pool 字段为显式归属（见 [vehicles.*]）。
# inventory_multiplier 不落参数：站端配比按供需恒等式自动派生——
#   站数(池) = ceil(池车日换电次数 ÷ 站日接待能力)（4站型分别反推）
#   站端配比 = 池站内电池GWh ÷ 池装车GWh，InventoryMultiplier = 站端配比 + 1
