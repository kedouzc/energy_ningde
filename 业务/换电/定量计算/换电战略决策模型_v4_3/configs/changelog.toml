# 变更台账：每一轮改了什么、为什么、你该盯哪个数。
#
# 【这份文件存在的唯一理由】用户不读程序，只看沙盘 HTML。
# 所以每一轮的改动必须在 HTML 上**有一行字说明 + 有一个数可对**，
# 否则"我做完了"这句话无法被复核，只能被相信。
#
# 分工（刻意的）：
#   · 本文件是**我写的话**：改了什么、为什么、你该盯什么、我预期它怎么变。
#   · `audit/baseline_history.json` 是**程序写的数**：每次构建自动追加实跑读数。
#   两者在沙盘里并排显示——**说法在左，读数在右，对不上一眼看见。**
#
# 【纪律】一轮一条，改完当轮就写，不许事后补。
# `expect` 必须在跑之前写下（否则它就不是预期，是解释）；跑完读数若与 expect 不符，
# 要么改 expect 并说明为什么猜错，要么就是真的出错了。

[[round]]
date  = "2026-09-15"
focus = "门槛与事件表（A8 / A9）"
what  = """把经济门的门槛从拍定的 12.4% 改成**等于 WACC 7.5%**（CRF 不再是一个可以手拍的数，
改成由 WACC 推导、每次加载硬校验）；事件表改成**重放版**——base.toml 只存并购前的初值，
并购后的当前值由事件表推出来，想改当前值只能补一张事件卡；补了蔚来电池银行这张预期事件卡。"""
why   = """① 12.4% 比你自己登记的每一个外部锚都高（蔚能 4.68%／协鑫 8.5–9.1%／启源 10.34%），
一个拍出来、还比所有参照都高的门槛，"门是红的"这句话说的是门槛不是生意；
② 现金流按 7.5% 折现算出估值，同一笔资本在门那里却要求 12.4%——**一个模型里两个资本的价格**；
③ 事件表原来是"账本和账实各记一遍，再断言两边相等"，断言只能发现不一致，说不出谁对。"""
watch = "EBITDA 覆盖倍数：三档应从 0.83／1.17／1.49 变成 1.16／1.63／2.09（悲观档翻绿）；**换电增量价值合计三档一个数都不该动**。"
expect = "覆盖倍数三档全部 ≥1.0；增量价值 2,106.1／10,118.6／24,068.0 不变。"

[[round]]
date  = "2026-09-14"
focus = "延长期的承载力与窗口口径；两个专题的自足性"
what  = """把"终局年之后车队还在长、站网够不够"这件事显式化：四个站型各报一个
「需要多少倍承载力 / 单站还剩多少余量」的对账；延长期长度从写死的 15 年改成
"推到车队规模压平为止"的判据。终局年专题的竞争死线改成点名式（当期对手是超充、
中期是绿色甲醇），并把年份从注释升格为有名字的参数。"""
why   = """写死的 15 年读起来像是借了运营年限的 15，而两者根本不是一回事；
改成判据之后当场炸出一个两年没人发现的缺陷——悲观档的渗透率曲线用了一个不会跟着情景走的
外部锚点，导致同一个"终局年电动化率"在两个程序里差了一半。"""
watch = "隐含倍数·计周转增长（桶① 那本账）；终局站数合计不该动。"
expect = "中性档桶① 微调（−0.1% 量级），主基线三档读数不变。"

[[round]]
date  = "2026-09-15b"
focus = "关掉三项自己造出来的欠债（A2③ / A2④ / R7）"
what  = """① 两条情景轴的 ±15% 摆幅：改成一句显式声明，不再找出处；
② 分母类信源：不再找"独立第三方"，用户已挑定；
③ 桶① 的回报率口径改对了——原来用税前的 16.69%，改成税后的 12.03%。"""
why   = """前两项是我把"看起来严谨"当成了研究需要，给自己加戏；
第三项原本被我"挂起"，但挂起说不出要再研究什么，就是拖延，所以当轮改掉。"""
watch = "隐含倍数·计周转增长会明显下降（那本账变小了）；**其余六个读数一个都不该动**。"
expect = "计周转倍数 10.35 → 约 9.5；换电增量价值、覆盖倍数、站数、EBITDA、永续账倍数全部不变。"

