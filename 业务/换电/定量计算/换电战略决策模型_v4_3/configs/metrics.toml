# ── ⑪ 四桶分解（2026-09-13i）───────────────────────────────────────────────
# 押注部分（倍数法归属 − 永续账归属）不是一件事，要拆成四桶：
# ①预测期外增长 ②基准外期权 ③风险低于假设 ④纯重估押注。**只有④是赌。**
# 桶① 由 src/turnover.py 从「保有量 / 更新周期 / 流量率」三个现有参数算出，不新拍数。
[[metric]]
key = "val.bucket1_growth"
source = "turnover"
label = "桶①·车队周转增长"
at = "turnover.bucket1_catl_yi"
unit = "亿元"
decimals = 1
group = "⑤估值"
note = "兑现年之后光靠车队周转（保有量追平流量率）带来的价值，CATL 归属口径。**它可被市场之外的东西证伪**（渗透率曲线、车型数、区域盈利都可观察），桶④不能——把它从押注里拆出来，等于把论点从不可证伪的一半移到可证伪的一半"

[[metric]]
key = "val.bucket1_share"
source = "turnover"
label = "桶①占押注部分比例"
at = "turnover.bucket1_share_of_bet"
unit = "%"
decimals = 0
scale = 100.0
group = "⑤估值"
note = "桶① ÷ 押注部分（对永续账）。**口径偏保守**：缺失的历史流量率用首年值代替，会高估兑现年保有渗透、低估剩余增长空间。补齐 2022–2025 实际流量率是当前最能改变这个数的一件事"

[[metric]]
key = "val.turnover_multiple"
source = "turnover"
label = "隐含倍数·计周转增长"
at = "turnover.implied_multiple"
unit = "×"
decimals = 2
group = "⑤估值"
note = "两段 DCF（延长期按加权 CAGR 增长、之后归零）÷ EBITDA。**增长按 ROIC 付了资本**——`fcff/(wacc−g)` 是白拿增长，不能用"

[[metric]]
key = "val.turnover_end_index"
source = "turnover"
label = "延长期末换电车队倍数"
at = "turnover.end_index"
unit = "倍"
decimals = 2
group = "⑤估值"
note = "兑现年＝1。延长期末换电车队是兑现年的几倍。**延长期长度由收敛判据定**——推到保有量年增速压平为止，不是借用运营年限（运营年限从换电站投产年起算，与兑现年后第几年是两件事）。口径：延长期只让电动化渗透（第 1 层）继续走，换电占电动（第 2 层）与 CATL 份额（第 3 层）冻结。2026-09-14 起逐年推保有量，不再折成 CAGR（常数增长率不是这条凹路径）"

[[metric]]
key = "val.turnover_horizon_years"
source = "turnover"
label = "延长期年数"
at = "turnover.horizon_years"
unit = "年"
decimals = 0
group = "⑤估值"
note = "**不是拍的年数，是收敛判据的落点**：逐年推到车队年增速压平为止，之后持平不做永续增长。改天花板或更新周期，这个年数会自己动——写死的常数不会。与运营年限数值相同纯属巧合，两者各有各的家"

[[metric]]
key = "val.turnover_free_capacity_share"
source = "turnover"
label = "延长期增量的免费承接比例"
at = "turnover.free_capacity_share"
unit = "%"
decimals = 0
scale = 100.0
group = "⑤估值"
note = "兑现年站网按 2030 车队建成后，2030 之后车队还在长；这一比例是**新增需求中落在单站既有物理余量里、不必新建站**的部分。**模型没有认领它**——延长期一律按新建站、按存量平均资本强度计提资本（`1−g/ROIC`），双工位与电网增容这两条更便宜的路都不进模型。所以它是保守量，不是余粮"

[[metric]]
key = "val.ke_derived"
source = "business"
label = "隐含股权成本"
at = "swap_business.dcf_ke_derived"
unit = "%"
decimals = 2
scale = 100.0
group = "⑤估值"
note = "由 WACC、债务比例、债务利率、税率反推：ke=(WACC−债务比例×债务利率×(1−税率))÷(1−债务比例)。**露出它才能判断这套折现率合不合理**——WACC 是一个声明，它隐含的股权要求回报是这个声明的后果，此前算了但没人看得见"

[[metric]]
key = "val.implied_multiple_true"
source = "business"
label = "隐含倍数·有限期账"
at = "swap_business.dcf_implied_multiple_true"
unit = "×"
decimals = 2
group = "⑤估值"
note = "有限期账 EV ÷ EBITDA。与 swap.dcf_implied_multiple（CRF 折现口径）不是同一个数：这条用的是两本账口径的 EV"

[[metric]]
key = "val.implied_multiple_perpetual"
source = "business"
