# ── 声明：兑现年之后的承载力从哪来（2026-09-14）────────────────────────────
# 追问：站网按兑现年车队规模建成，可兑现年之后电动化渗透还在涨，承载力怎么办？
# 承载力有四条来源，**由便宜到贵**：
#   ① 填满单站既有物理余量（免费：规划能力＜物理上限的那一段，见 derived.station_capacity）
#   ② 加工位（摊薄同一块土地/接电/土建，卡在「手速」那一侧的站型有效）
#   ③ 电网增容（卡在「能量」那一侧的站型有效，加工位对它无效）
#   ④ 新建站（最贵：土地、接电、土建、人员全部重来一遍）
# **模型的口径：一律按 ④ 计价。** 延长期的增长资本由 `turnover.py` 按
# `1 − g/ROIC` 计提，ROIC 是兑现年存量的平均回报——等价于"按存量的单位造价复制一份"，
# 而存量是按单工位造价建的。①②③ 只能让代价更低，所以模型付的是上沿。
# 因此 **scale.py 不需要延长到兑现年之后**：那样做要新拍一条 15 年的建站节奏
# （一个全新的、没有信源的假设面），把标定升级成精算，还会与 `1 − g/ROIC` 重复计价。
# 这里只声明，读数由 turnover.pools 报（四站型各自的「需要倍数 / 单站余量 / 卡在哪一侧」）。
#
# **推翻条件**（任一成立，上面这段"付的是上沿"就不再成立）：
#   · 延长期新增站的单站利用率系统性低于兑现年平均——增量 ROIC ＜ 平均 ROIC，
#     `1 − g/ROIC` 会低估增长的代价。可观察：单站日均换电次数（tracker 月度）。
#   · 站址稀缺使 ④ 不可得（拿不到地/接不上电），这时"付钱就能扩"这个前提本身失效。
#     可观察：高速服务区/城市场站的站址获取周期。
# 公司公开规划（报告对照用，不替代需求反推）：CATL 官方 catl.com/news/9516
official_2026_station_plan = { heavy = 900, choco = 3000 }
