
<h2 class="sr-only">共振投资框架：双场错位矩阵，通过实体场强度Ω×Γ和资本场偏差Δ构建四象限决策系统，含参数化简和介入退出规则</h2>

  <div style="display:grid;grid-template-columns:1fr 26px 1fr 38px 1fr;align-items:center;margin-bottom:16px;gap:0;">

    </div>

    <div style="text-align:center;font-size:15px;color:var(--color-text-tertiary);">×</div>

    <div style="background:var(--color-background-info);border:0.5px solid var(--color-border-info);border-radius:var(--border-radius-md);padding:10px 12px;cursor:pointer;" onclick="sendPrompt('Γ方向轨迹详解：γ调谐力和η飞轮效应的判断维度，什么情况下Γ转负？')">

    <div style="text-align:center;font-size:11px;font-weight:500;color:var(--color-text-tertiary);letter-spacing:1px;">vs</div>

    <div style="background:var(--color-background-warning);border:0.5px solid var(--color-border-warning);border-radius:var(--border-radius-md);padding:10px 12px;cursor:pointer;" onclick="sendPrompt('Δ资本偏差详解：如何用PE/PEG/EV-EBITDA计算偏差系数？Δ<0.8意味着什么？')">

    <text class="ts" x="617" y="292" text-anchor="end" style="fill:var(--color-text-tertiary)">Δ高（市场乐观）</text>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;">
    <div style="background:var(--color-background-success);border:0.5px solid var(--color-border-success);border-radius:var(--border-radius-md);padding:10px 14px;cursor:pointer;" onclick="sendPrompt('介入条件三者同时满足的实操检查清单：Ω阈值如何定？Γ向上的判断依据？Δ<0.8的计算方式？')">
      <div style="font-size:12px;font-weight:500;color:var(--color-text-success);margin-bottom:4px;">介入条件（三者同时满足）</div>
