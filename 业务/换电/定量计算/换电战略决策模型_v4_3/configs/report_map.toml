# 报告骨架：读数池的三个索引
#
# ── 主语是「读数池」（src/lab.py 的 METRICS），不是「章」────────────────────
# 三个视图（主链正文 / 顶部结论卡 / 一页纸）都从**同一个池子**里挑数，
# 彼此是**重排关系**：主链按"论证依赖"分组，卡片按"重要度"取主题，
# 一页纸按"决策核对"分组（格式见 narrative/一页纸.md，不在此表）。
#
# ── 主张 vs 引用（2026-09-11 定）──────────────────────────────────────────
#   owns = **主张**：这一章对它负责——论证它、给出它的推翻条件、它越阈值时标这一章待复核。
#   uses = **引用**：借它做下一步推论，不对它负责。
# 判据：**同一个 key 只能有一个 owns**（生成期机械校验）。这样跨章引用是允许的、
# 而"两章都声称对这个数负责"会被拦住——这正是"一件事只能有一个家"在数值层的落地。
#
# ── 定量收口与定性收口 ────────────────────────────────────────────────────
#   owns = 定量收口（必须是 METRICS key）
#   qual = 定性收口（文字，用于纯定性章：它的收口是**外部可观察的事实**，模型算不出来）
# 两者至少要有一样；定量章的 owns 上限 2 个；章内检验项另见 [[gate]]。
#
# ── 为什么放 toml 而不是 .py / .md ────────────────────────────────────────
# 它是"顺序与归属的声明"，属参数层；放 toml 才能被 Python 生成期与浏览器运行期
# 读到**同一份**（configs/sandbox_dashboard.toml 是先例）。

# ── 2026-09-17c 主链换骨架 ────────────────────────────────────────────────
# 「0 + 八章」→「0 + 九章」双视角共振结构（见 DECISIONS 2026-09-17 / 17b / 17c，框架提案 §1.1.1）。
# file 字段是章文件名的唯一家（沙盘显示路径从这里取，不再用"章号_标题"拼）。
# [[gate]] 在界面上叫「检验项」：章内有通过／不通过形状的子判断（旧第 4 章五道门拆到第 5、6 章）。

# ═══════════════════════════════════════════════ 索引一：主链正文（0 + 九章）

