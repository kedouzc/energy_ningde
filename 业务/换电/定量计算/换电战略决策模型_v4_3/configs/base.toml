[finance]
# WACC 7.5%：能源基建行业收益率 6–8% 的中性中枢（显式假设）。参照谱系：
# 蔚能 REITs 4.68%（资产端下限）→ 协鑫能科 8.5–9.1% → 启源股权评估 10.34%（股权端上限）。
wacc.v = 0.075
wacc.label = "WACC"
wacc.unit = "%"
wacc.decimals = 1
wacc.scale = 100.0
wacc.note = "**声明**（不是外部信源）：能源基建行业收益率 6–8% 的中枢，取 7.5%，不作 CAPM 推导。参照谱系：蔚能 REITs 4.68%（资产端下限）→ 协鑫能科 8.5–9.1% → 启源股权评估 10.34%（股权端上限）。什么会让我改它：出现换电资产自身的市场化融资成本（ABS/REITs 发行利率），或谱系中枢整体移动超过 1pct。【2026-09-13f 更正：本字段原写「蔚来换电ABS融资基准，直接采用」，与上方注释块的取值理由矛盾，且从未查到该数据——信封化迁移时没核对，结果对外发布的是错的那一条】"
# CRF **不再是一个拍值，是 WACC 的推论**：CRF = wacc ÷ (1−(1+wacc)^−运营年限)。
# `config_loader.load_config()` 每次加载都硬断言这个恒等式，改 WACC 不改这里会当场中断。
#
# 【2026-09-15 改·A8】原值 0.15（隐含要求回报 12.4%，来自 v3.2 的 10–15% 区间取中值）。
# 原注释写着"不要用 WACC 反推的 0.1133 来质疑本值——那是成本线口径"。**这句话现在被推翻，理由两条：**
#
#   ① **同一个模型里不能有两个"资本的价格"。** 现金流按 WACC 7.5% 折现算出 EV，
#      同一笔资本在门那里却要求 12.4%——等于说**模型自己算出来的 EV，是用一个自己都不认可的
#      折现率算的**。两者必须同源。这是「一件事只能有一个家」在数上的形态，
#      原注释把它当成两个口径，是把矛盾命名成了区分。
#   ② **门槛和安全边际要分开。** 12.4% 把 4.9pct 的安全垫焊进了门槛，于是"门是红的"
#      同时携带两个信息——生意不够好、以及我要求得高——读者分不开。
#      分开之后：**门测"赚不赚得回资本成本"（覆盖 1.0 ＝ 刚好赚回，不是盈亏平衡）**，
#      安全垫由**余量**与**翻转轴**表达（`gates.py` 本来就在报"要求回报升到多少翻红"）。
#
# 原注释里"估值要看期望收益率、必然高于成本线"这句，回答的是**投资人要不要买**；
# 本模型回答的是**这门生意值多少**。两个问题，两个数，不该共用一个参数。
# 12.4% 没有消失，它变成了经济门的**翻转阈值**——信息量比当门槛时更大。
#
# 什么会让我改它：改 WACC（唯一入口），或者改运营年限。**不要直接改这个数。**
capital_recovery_factor = 0.1133
# 要求回报参照区间（v3.2 §1.2.2 的 10–15%）：**已不再进计算**，保留作第 4 章叙述的参照谱系——
# 与蔚能 4.68% / 协鑫 8.5–9.1% / 启源 10.34% 并列，用来说明"门槛定在哪一档，结论就翻在哪一档"。
required_return_range = [0.10, 0.15]
tax_rate = 0.25
# 债务比例 60%：经验假设（类固收项目可做到 1:1.5 杠杆）
debt_ratio.v = 0.60
