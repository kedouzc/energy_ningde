[meta]
model_name = "换电战略决策模型_v4.2"
model_version = "4.2"
version_date = "2026-08-27"
reference_year = 2026
target_year = 2030
currency = "亿元人民币"
base_scenario = "中性"
# 参数溯源纪律：每个根本外生参数后附 source_url 注释；若为经验假设（非外部信源）须显式标注。
# 车辆全链路根本参数来源：_archive/重卡与城配物流换电规模测算_合并对比.py（v2）及
#   《换电毛估估_折扣链与总表_v3.2》L330-344（里程池→活跃车反推法）。

[modeling.rounding]
# “毛估估”只在自然业务节点取整，避免旧版在中间层反复取整形成复合偏差：
# 终局车型车辆数与该车型加权频次各保留1位小数后再反推站数；金额在报告中保留1位。
# 年度批次、折现和税盾内部仍保留精度，防止五年累计因逐行取整被系统性放大或缩小。
terminal_vehicle_decimals = 1
terminal_frequency_decimals = 1
report_money_decimals = 1

# ----------------------财务数据-----------------------------

[finance]
wacc = 0.075   # 蔚来ABS评估数据
capital_recovery_factor = 0.15
required_return_range = [0.10, 0.15]
tax_rate = 0.25
debt_ratio = 0.60   # 经验假设，类固收项目可以做到1:1.5杠杆
debt_interest_rate = 0.025 # CATL和蔚来在2026年发行的绿债利率
construction_ownership = 0.40   #  参考蔚来电池银行持股比例
manufacturing_pe = 20.0   # CATL目前估值
swap_ev_ebitda = 18.0   # 经验假设
manager_fee_rate = 0.010   # 轻资产管理费率，先设定，本次计算不涉及
manager_net_margin = 0.40   # 轻资产管理净利率，先设定，本次计算不涉及
manager_pe = 25.0   # 轻资产管理PE，先设定，本次计算不涉及
transaction_cost_rate = 0.020
model_horizon_years = 15   # 换电业务分析期，与蔚来电池银行ABS评估年限一致

