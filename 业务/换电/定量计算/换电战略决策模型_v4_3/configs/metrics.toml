# ══════════════════════════════════════════════════════════════════════════
# 输出字典：模型跑完之后，一共算出了哪些数
#
# 模型按用途只有两层（2026-09-13 定稿）：
#   base.toml   —— 管**进**：功能段存参数值（含外部查来的事实，如全国储能装机）；
#                   被叙述引用的参数在功能段**就地信封化**（<键>.v ＋ label/unit/…，
#                   key＝点分路径，不另开登记表、不造别名），外部引述统一在末尾
#                   [[external_quote]]（ext.*，不进计算）；
#   metrics.toml —— 管**出**：算出来了哪些结果（本文件只有 at 取快照的输出）。
#
# ── 三条规矩 ──────────────────────────────────────────────────────────────
# 1. **这里不写任何公式。** 需要计算的量，一律在跟它关系最紧密的那个程序里算好
#    （车辆类→scale.py、资本类→capex.py、经营类→business.py、合并类→consolidation.py、
#      资金类→group_constraints.py、轻资产→capital_cycle.py），这里只引用结果。
# 2. **一词一名。** label 是唯一的中文名，写 MD 时就写它；不设别名（别名多了会混）。
#    写错了程序会报错并列出最像的 3 个候选，照着改即可。
# 3. **每条都要在程序里找得到。** 加载时逐条验证并中断指名，共三道：
#    审计① 有没有取数路径（`at`；配置侧路径＝base.toml 功能段就地信封的点分路径）；
#    审计② `source` 写的程序里，真能找到这条路径的最后一段；
#    审计③ 实跑时某条值为 NaN → 集中报一次（"`at` 走通但没值"与"值为零"是两件事）。
#
# ── 字段说明 ──────────────────────────────────────────────────────────────
# key      = 程序内部的名字（MD 里也可以写这个，兼容旧写法）
# label    = 唯一的中文名（MD 里推荐写这个）
# at       = 从**模型结果**里取值，点分路径（dict 也用 `.` 递进）
# source   = 这个数**在哪个程序里算出来的**（模块文件名：scale/capex/business/tco/
#            consolidation/group_constraints/capital_cycle/model）。
#            心算觉得不对时，`python src/lab.py metrics 名字` 会把它打出来，
#            直接去那个 .py 查计算逻辑，不用猜 key 前缀（ops/swap/val/fund 都不是程序名）。
#            **加载时由 `lab.load_metrics` 的审计②机械核对**（2026-09-12 立）：
#            路径最后一段必须在 `src/<source>.py` 里找得到（字面量／它归属的 dataclass／
#            近似函数名三者之一），对不上就中断——source 写错不会让数字变错，但会让人
#            按图索骥走到错误的程序里；它骗的不是程序，是人的时间。
#            **定位具体函数**：在 `src/<source>.py` 里 grep `at` 路径的**最后一段**
#            （字段名，如 `total_veh_2030_wan`）即到。
#            **不要在此登记函数名**（函数重命名会使记录变错，比"只到模块"更误导）。
#            （从配置取值的输入与 external source 已在 2026-09-13 改为 base.toml
#             功能段就地信封，本文件不再出现 at_cfg 条目。）
# scale    = 取值后乘的系数（做单位换算，如比值→百分比用 100）
# decimals = 显示几位小数
# fmt      = format呈现格式，缺省为普通千分位数值；"year"＝年份，整数且**不加千分位**
#            （2030，不是 2,030）。facts 事实包与沙盘 verdict vals 的渲染共用此规则，
#            改格式只改 lab.Metric 这一处。
# unit     = 单位（MD 里**不要再手写单位**——`{{名称}}` 自带单位；手写会和字典不一致；
#            需要裸数字时写 `{{名称:n}}`）
# group    = 分组（①运营规模 … ⑧重卡）
# note     = 口径说明：它是什么口径、和谁的区别（存量/流量、100%/归属、现值/名义）
# ══════════════════════════════════════════════════════════════════════════

