# 这是**测量用的尺子，不是情景、不是预测**——改大改小只影响灵敏度读数的精度，
# 不改变"谁重要谁不重要"的排序。一般保持 0.10 即可。
# 真正要校准的是 [drivers.*] 里的悲观/乐观档位，跟这里无关（三者别搞混）。
