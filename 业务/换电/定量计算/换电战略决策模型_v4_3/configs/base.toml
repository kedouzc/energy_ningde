comparison_scenario_name = "现状_启源已入股"

# 站址与电网接入占**站体投资**的比例：**这是"只买到地"值多少钱的全部依据**。
#
# 【口径：分母是站体，不含电池】电池价格有自己的年份曲线、而且是 CATL 自供，
# 拿含电池的总投资当分母算这个比例是错的——会把一个"设备 vs 站址"的问题，
# 稀释成一个"电池 vs 其他"的问题。所以从站体本身倒算：
#
#   巧克力乘用站（单工位）
#     · 换电设备（博众精工整站报价）        160 万   ← 机械本体 80 ＋ 控制 25 ＋ 充电模块 35 ＋ 辅助 20
#                                                    **明确不含**外部箱变、高压进线、土建基础
#     · 外线增容与土建消防                   40 万   ← 外部电力接入 15–25 ＋ 基础施工消防 15–20
#     · 站体合计                            200 万   ＝ station_body_capex_wan
#   → 站址与电网接入 40 ÷ 200 = **20%**
#
# 信源：src.bozhon_station_equipment（博众精工官网产品页 + 雪球 2026-04 整站报价定义）；
# 推算与交叉验证见 `定性分析/宁德时代_超换一体站_财务模型_修正版.md` §八。
# 旁证：博众强调"落站周期≤8 小时"，前提正是**现场已有电力接入条件**——
# 这句话本身就说明电力接入是站体之外、且必须先有的一块。
#
# **⚠️ 骐骥重卡站不类推**：重卡站变压器容量大得多，电力接入占比应更高，
# 但目前**没有同口径的设备/站址拆分信源**。在取到之前，重卡侧的站址复用一律按 0 处理
# （宁可不算，不拿乘用站的比例去套）。
#
# **三条必须同时说出的限定**：
#   ① 时间成本不在这张表里——宁德时代自述建站"从选地到验收原本近 3 个月、流程改造后 16 天"，
#      **那是期权价值，不是会计价值**；
#   ② 占比低 ≠ 价值低——北京亦庄某重卡换电站投产一年多无法服务，原因是变压器功率不足，
#      "电力扩容难度极大、成本极高"。**电力容量不够可以让整座站归零**；
#   ③ 站体造价本身在降（蔚来单站 150 万四代 → 100 万五代；宁德时代地基深度 2.3–2.7 米压到 0.8 米），
#      分母变小时这个比例会上行，需随站体造价一起复核。
site_and_grid_cost_share.v = 0.20
site_and_grid_cost_share.label = "站址与电网接入占站体造价比例"
site_and_grid_cost_share.unit = "%"
site_and_grid_cost_share.decimals = 0
site_and_grid_cost_share.scale = 100.0
site_and_grid_cost_share.note = "并购只买到站址时能省下的那一份。分母是**站体**（设备＋站址），不含电池——电池自供且有独立价格曲线，不该进这个比例。巧克力乘用站：设备 160 万 ＋ 外线增容与土建 40 万 ＝ 站体 200 万，站址占 20%。重卡站无同口径拆分信源，站址复用按 0 处理。**它是会计下限，不含时间与电力容量的期权价值**"

