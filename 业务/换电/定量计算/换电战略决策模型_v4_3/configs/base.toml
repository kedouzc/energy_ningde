# ═══════════════════════════════════════════════════════════════════════
# 【2026-09-14 · 重卡电动化曲线改 logistic】——旧曲线是掰出来的，新曲线只声明一个数
# ───────────────────────────────────────────────────────────────────────
# 旧：nev_rates = [0.35, 0.43, 0.46, 0.48, 0.50]，年增量 +8, +3, +2, +2。
#     它等于说 2027 年在 43% 处就过了拐点；但 **logistic 在拐点附近是对称的**，
#     43%→46% 的增量不可能只有前一年的三分之一。**它不属于任何一条 logistic，
#     是为了让 2030 落在 JPM 的 0.50 上硬掰出来的。**
#     而政策目标是 2030 年 40%（交规划发〔2026〕52 号），超额完成本就正常，
#     JPM 的 50% 不是必须锚的点。
#
# 新：**扩散过程用扩散的参数化。** logistic 有三个参数 L / k / t0：
#     · 声明 L（天花板）＝ **唯一要拍的数**；
#     · k 与 t0 由**最近两个年度实测**拟合（2025 实测 28.89% ＋ 2026 估计 35%）——**零择时声明**。
#     此前曾另设「到达 0.9L 的年份」作为第二个信息，实测表明它与两点拟合几乎同解
#     （2030：58% vs 59%），**属冗余声明，已删**。
#     **拐点是推论不是假设**：logistic 的拐点恒在 L/2，L=0.80 ⇒ 拐点 40%，约在 2027 年。
#
# ⚠️ 口径：年度流量（当年新车里电动的占比），**不是保有量**。保有量要等一个更新周期
#     才追得上流量——这段差就是桶①（见 src/turnover.py）。
# ⚠️ 只看年度/累计，**不从逐月总结规律**：商用车是生产资料，销量季节性极强
#     （春节在 1 月或 2 月、年末抢装），月度值不构成趋势证据。
# ═══════════════════════════════════════════════════════════════════════
# 天花板 80%：保守取值。扣掉的那 20% 是结构性长尾——极寒、高原、超远程、低频个体户，
# **而这条长尾正是绿色甲醇可能长期占住的场景**（见 topics/竞争格局 甲醇一节）。
# 什么会让我改它：① 兆瓦快充在超远程场景成熟 → 上调；② 绿醇成本收敛并铺开加注网 → 下调。
nev_ceiling.v = 0.80
nev_ceiling.label = "重卡电动化天花板"
nev_ceiling.unit = "%"
nev_ceiling.decimals = 0
nev_ceiling.scale = 100.0
nev_ceiling.note = "logistic 的 L。**唯一声明的数**，k 与 t0 由最近两个年度实测拟合。它对 2030 之前几乎无影响（L=80% 与 95% 的 2030 只差 3pct），主要影响桶①的延长段"
# 拟合锚①：2025 年度实测（第一商用车网上险量累计口径，不含出口/军车）
nev_anchor_year = 2025
nev_anchor_rate = 0.2889
# 2025 新能源重卡 233,206 辆（+181.91%）：纯电 96.38%、换电占纯电 29.00%（第一商用车网+智研双源一致）
# 拟合锚②＝ nev_rates[0]（2026 估计 35%：2026 上半年累计 33.68%，下半年季节性上行）
# 以下 2026–2030 由 logistic(L=0.80, 两点拟合) 生成，非手工填写：
nev_rates = [0.35, 0.41, 0.48, 0.54, 0.59]
pure_electric_share = 1.0
# 无换电基准市占由 [charge_share.heavy] 中性档派生（= (0.35+0.55)/2 = 0.45，JPM ~50% 减 5pct 竞争缓冲），
# 不再单列 no_swap_catl_share（详见 [charge_share] 段注释）。
# 2025 已入 CATL 换电体系的重卡存量 ~0.7 万辆：盐田港案例
existing_catl_swap_stock_wan = 0.7

# ═══════════════════════════════════════════════════════════════════════
# 【2026-09-14 · 声明】重卡三场景的 swap_penetration 是本模型最脆弱的一组假设
# ───────────────────────────────────────────────────────────────────────
# **内容**：兑现年换电占纯电重卡的加权比例 ＝ 0.38×0.30 ＋ 0.50×0.50 ＋ 0.12×0.70 ＝ **44.8%**。
#
# **它与实测的关系（必须写出来，否则这句话在仓库里一处都没有）**：
#   换电÷纯电（累计，第一商用车网上险量口径）
#   2024 全年 38.4% → 2025-12 30.4% → 2026-06 **24.6%**，每期都在跌，无一次反弹。
#   **模型假设是最新实测的 1.8 倍，方向相反。** 2024 年实测与本假设几乎重合——
#   **这三个数像是按 2024 年的世界标定的。**
#   所以本组参数不是"当前值"，是一个**明确的反转预期**：份额从 24.6% 回升到 44.8%。
#
# **位置依据（机制，不是趋势外推）**：换电对超充的胜负手是**单站吞吐量**——
# 换电要同时摊薄「站 ＋ 电池」两笔资产，超充只摊「站」一笔。吞吐起不来，换电必输。
# 而吞吐有两个前提条件：
#   ① **网络密度**：干线在密度铺够之前**根本用不了换电**，这不是偏好问题是可用性问题；
#   ② **服务定价**：密度够了之后，竞争落到价格。
# 份额下滑因此可以有两种完全相反的解释，见 `topics/竞争格局_三足鼎立与赛道内玩家`
# 「换电占电动为什么在跌」一节（混合效应 vs 正面失守 vs 挤出效应）。
#
# **什么会让我改它**：
#   ① 并购启源后换电服务费**未**出现下行 → 挤出效应假说被证伪，本组参数应下修；
#   ② 换电÷纯电累计占比连续 4 期仍在跌（即并购与网络加密均未止住） → 下修；
#   ③ 出现分场景的换电占比数据，显示**短倒场景内部**的换电占比也在跌 → 是正面失守，大幅下修。
#   （反之，短倒内部稳定而总量在跌 ＝ 混合效应，本组参数不动。）
#
# ⚠️ **本组是「竞争性变量」不是「结构性常数」**：它是竞争的结果，竞争每天在变。
#    复核周期 **1 个季度**；数据源 `data/电车人新能源重卡月度数据_2024-2026_口径更新.xlsx`。
# ═══════════════════════════════════════════════════════════════════════

