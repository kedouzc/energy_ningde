# ----------------------产能投资强度（2026-09-18 新增）-----------------------------
# 用途：① 测算满足兑现年装机所需的产能投资额；② 论证车企自建与二线扩张的门槛。
# 口径与出处：
#  - 头部厂商单位产能投资额已从 2020 年的约 8.3 亿元/GWh 降到 2025 上半年的约 2 亿元/GWh
#    （设备投资 1.14 亿元/GWh、设备占比约六成，按宁德时代扩产路径推算，src.qianzhan_equipment_2026）；
#  - 新进入者按 2022 年项目口径 3–4.9 亿元/GWh（宁德时代自身当年披露"每 GWh 约 3 亿元"，
#    弗迪、楚能、中创新航项目 4–4.5 亿元/GWh，src.gasgoo_capex_2022），本报告取区间中位 3.5；
#  - 现有与在建产能取公司 2025 年报（src.catl_ar2025_news）。
[capacity_investment]
leader_intensity_yi_per_gwh.v = 2.0
leader_intensity_yi_per_gwh.label = "头部单位产能投资强度"
leader_intensity_yi_per_gwh.unit = "亿元/GWh"
leader_intensity_yi_per_gwh.decimals = 1
leader_intensity_yi_per_gwh.note = "头部厂商单位产能投资强度"
newcomer_intensity_yi_per_gwh.v = 3.0
newcomer_intensity_yi_per_gwh.label = "新进入者单位产能投资强度"
newcomer_intensity_yi_per_gwh.unit = "亿元/GWh"
newcomer_intensity_yi_per_gwh.decimals = 1
newcomer_intensity_yi_per_gwh.note = "新进入者单位产能投资强度：广汽因湃 109 亿元 / 36 GWh 的实证值（src.aion_yinpai_capex）"
existing_capacity_gwh = 772.0         # 2025 年末现有产能
under_construction_gwh = 321.0        # 2025 年末在建产能
depreciation_years = 8.0              # 产线折旧年限（用于把投资强度换成每 kWh 的折旧负担）
benchmark_line_gwh = 18.0             # 对标产线规模：吉利重庆涪陵一期规划年产能（src.geely_line_202609）
# —— 自建 vs 外购的收口参数（2026-09-18b 新增）——
# 只算折旧到不了结论：要判断自建是否有利可图，必须把「现金成本 ＋ 折旧 ＋ 良率损失」加总，
# 再和外购价比。以下四个参数就是补齐那一截的。
cell_purchase_price_rmb_kwh = 400.0   # 外购磷酸铁锂动力电芯市价（src.trendforce_cell_202609，0.40 元/Wh）
self_cash_cost_rmb_kwh.v = 370.0
self_cash_cost_rmb_kwh.label = "自建现金成本"
self_cash_cost_rmb_kwh.unit = "元/kWh"
self_cash_cost_rmb_kwh.decimals = 0
self_cash_cost_rmb_kwh.note = "自建的现金成本（直接材料＋直接人工＋能源辅料，不含折旧，src.haitong_cost_2024 结构 × 公司年报单位成本校准）"
yield_gap_rmb_kwh.v = 20.0
yield_gap_rmb_kwh.label = "与龙头的良率差"
yield_gap_rmb_kwh.unit = "元/kWh"
yield_gap_rmb_kwh.decimals = 0
yield_gap_rmb_kwh.note = "成熟期良率与龙头的差（东吴口径「良率＋利用率」合计 0.03 元/Wh 中归入良率的一半，src.dongwu_costgap_2024）"
ramp_utilization = 0.30               # 爬坡期产能利用率：用来算前 18 个月的折旧负担
half_utilization = 0.50               # 半产口径：新建产能备案的审批门槛也正是这条线（src.eeo_capacity_202609）


